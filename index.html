  };
  function renderLevels() {
    ui.levels.innerHTML = '';
    LOCS.forEach((l, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'cr-lvl' + (i === selLevel ? ' sel' : '');
      b.disabled = i >= unlocked;
      b.setAttribute('aria-label', i < unlocked ? `Level ${i + 1}: ${l.name}` : `Level ${i + 1}, locked`);
      b.innerHTML = `<img class="thumb" src="${TILE_IMG[l.key]}" alt="" draggable="false">` + `<span class="num">${i + 1}</span>` + (i < unlocked ? '' : `<span class="lock">${LOCK_SVG}</span>`);
      b.addEventListener('click', () => selectLevel(i));
      ui.levels.appendChild(b);
    });
    ui.lvlCount.textContent = `${unlocked} / ${LOCS.length}`;
    ui.playSub.textContent = `${selLevel + 1} · ${LOCS[selLevel].name}`;
  }
  function selectLevel(i) {
    if (i >= unlocked) return;
    selLevel = i;
    try { localStorage.setItem('casper-run-sel', String(i)); } catch (e) {}
    renderLevels();
    if (G.state === 'menu') previewLevel(i);
  }
  // в меню за карточкой виден мир выбранного уровня
  function previewLevel(i) {
    for (const o of G.objs) removeObj(o);
    G.objs = []; G.dist = i * LOC_LEN + 10; G.startDist = G.dist; G.spawnAt = G.dist + 24;
    const L = LOCS[i];
    atmo.top.copy(L.cTop); atmo.fog.copy(L.cFog); atmo.low.copy(L.cLow); atmo.mount.copy(L.cMount);
  }
  function toMenu() {
    G.state = 'menu';
    ui.over.hidden = true; ui.menu.hidden = false;
    renderLevels();
    previewLevel(selLevel);
  }

  function start() {
    initAudio();
    reset(selLevel);
    ptrs.clear();
    G.state = 'play';
    ui.menu.hidden = true; ui.over.hidden = true; ui.pause.hidden = true;
    ui.hud.hidden = false; ui.wind.hidden = false; ui.ring.hidden = false; ui.chip.hidden = true;
    lastMode = null; lastLevel = null; lastPct = -1;
    toast(levelLabel(selLevel), LOCS[selLevel].name);
    root.focus({ preventScroll: true });
  }
  function pauseGame() {
    if (G.state !== 'play') return;
    G.state = 'paused'; ui.pause.hidden = false;
  }
  function resume() {
    if (G.state !== 'paused') return;
    initAudio();
    G.state = 'play'; ui.pause.hidden = true; last = performance.now();
    root.focus({ preventScroll: true });
  }
  function die(cause, o) {
    G.state = 'dying'; G.cause = cause; G.deathT = 0; G.shake = reduceMotion ? 0 : 0.35;
    G.speed = 0;
    // отскок от препятствия к камере, чтобы оно не загораживало привидение
    G.knockTo = o ? Math.max(0, zOf(o.w) + 0.7 + PZ) : 0;
    G.causeLoc = o ? locIdx(o.w) : 0;
    pl.lane = Math.round(pl.x);
    pl.ghost = false;
    sparks.emit(pl.x, 0.7, -PZ, 26, ['#f1ebdd', '#d9d0e6', '#79f2cf'], 2.4, 3, 0.9, 1.6);
    sfx(420, 90, 0.35, 'sawtooth', 0.05);
    sfx(900, 600, 0.12, 'triangle', 0.04, 0.35);
    sfx(1100, 700, 0.12, 'triangle', 0.04, 0.5);
    try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
  }
  function scoreOf() { return Math.floor((G.dist - G.startDist) * 0.4) + G.coins * 10 + G.bonus; }
  function showOver() {
    G.state = 'over';
    const s = scoreOf();
    const isBest = s > best;
    if (isBest) { best = s; try { localStorage.setItem('casper-run-best', String(best)); } catch (e) {} }
    ui.fCoins.textContent = G.coins; ui.fBest.textContent = best;
    // очки «набегают» от нуля — как в аркадах
    ui.fScore.textContent = '0';
    const t0 = performance.now(), dur = Math.min(1400, 400 + s * 2);
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      ui.fScore.textContent = Math.round(s * e);
      if (k < 1 && G.state === 'over') requestAnimationFrame(tick);
      else ui.fScore.textContent = s;
    };
    requestAnimationFrame(tick);
    if (s > 0) { sfx(600, 900, 0.08, 'square', 0.025, 0.1); sfx(900, 1300, 0.1, 'square', 0.025, dur / 1000); }
    ui.best.textContent = best;
    ui.newBest.hidden = !isBest || s === 0;
    ui.unlocked.hidden = !G.newUnlocks.length;
    if (G.newUnlocks.length) ui.unlocked.textContent = 'Unlocked: ' + G.newUnlocks.map(i => LOCS[i].name).join(', ');
    ui.hud.hidden = true; ui.wind.hidden = true; ui.ring.hidden = true; ui.chip.hidden = true; ui.toast.hidden = true; ui.over.hidden = false;
  }
  function endArmor() {
    G.armorT = 0; G.grace = 0.7;
    debris.emit(pl.x, 0.8, -PZ, 26, ['#cfd4de', '#8a90a0', '#23222e'], 2.6, 9, 1.1);
    sparks.emit(pl.x, 0.8, -PZ, 14, ['#79f2cf'], 1.6, 1, 0.8, 1.8);
    sfx(300, 120, 0.25, 'square', 0.04);
  }

  // ---------- обновление ----------
  function update(dt) {
    G.dt = dt;
    updateWind(dt);
    if (G.state === 'play') {
      G.t += dt;
      G.speed = speedFor(G.wind, G.t);
    } else if (G.state === 'menu') {
      G.speed = 6;
      pl.ghost = Math.floor(T / 2.2) % 2 === 1;
    } else if (G.state === 'dying') {
      G.speed = 0;
      G.knock += (G.knockTo - G.knock) * Math.min(1, dt * 9);
      G.deathT += dt;
      if (G.deathT > 1.3) showOver();
    } else if (G.state === 'over') {
      G.speed = 0;
    }

    G.dist += G.speed * dt;
    if (G.state === 'play' || G.state === 'menu') spawn();
    G.objs = G.objs.filter(o => {
      const keep = o.w - G.dist > -4 && !o.broken;
      if (!keep) removeObj(o);
      return keep;
    });

    const prevX = pl.x;
    pl.x += (pl.lane - pl.x) * Math.min(1, dt * 20);
    pl.vx = (pl.x - prevX) / Math.max(dt, 1e-3);
    pl.phase += ((pl.ghost ? 1 : 0) - pl.phase) * Math.min(1, dt * 12);
    const faceTarget = G.state === 'play' || G.state === 'paused' ? 0 : 1;
    pl.face += (faceTarget - pl.face) * Math.min(1, dt * (faceTarget ? 7 : 6));
    pl.squash *= Math.pow(0.002, dt);

    if (G.state === 'play') {
      const seg = segOf(G.dist + PZ);
      if (seg !== G.seg) {
        G.seg = seg;
        const idx = seg % LOCS.length;
        // долетел до уровня — он открывается навсегда
        if (idx + 1 > unlocked) {
          unlocked = idx + 1; G.newUnlocks.push(idx);
          try { localStorage.setItem('casper-run-unlocked', String(unlocked)); } catch (e) {}
          toast('New level unlocked', LOCS[idx].name);
          sfx(520, 1040, 0.25, 'triangle', 0.05); sfx(780, 1560, 0.3, 'triangle', 0.04, 0.12);
        } else toast(levelLabel(seg), LOCS[idx].name);
      }

      if (G.armorT > 0) {
        G.armorT -= dt;
        G.energy = Math.min(1, G.energy + dt * 0.22);
        if (G.armorT <= 0) endArmor();
      } else if (pl.ghost) {
        G.energy -= dt * 0.34;
        if (G.energy <= 0) { G.energy = 0; pl.ghost = false; sfx(500, 140, 0.25, 'triangle', 0.05); }
      } else {
        G.energy = Math.min(1, G.energy + dt * 0.22);
      }
      G.grace = Math.max(0, G.grace - dt);
      const safe = G.armorT > 0 || G.grace > 0;

      for (const o of G.objs) {
        const z = o.w - G.dist;
        const inLane = Math.abs(pl.x - o.lane) < 0.55;
        // для препятствий хитбокс уже, чтобы задевание краем при смене полосы прощалось
        const hitLane = Math.abs(pl.x - o.lane) < 0.42;
        if (o.type === 'wall') {
          if (hitLane && z <= PZ + 0.2 && z + 0.45 >= PZ - 0.1) {
            if (G.armorT > 0) {
              o.broken = true; G.bonus += 5;
              const key = keyOf(o.w);
              const cols = { city: ['#e2e6ee', '#a9b1c2', '#62d6ff'], garden: ['#ddd6c2', '#a8a294', '#4e6a3a'], cemetery: ['#d3d7da', '#8d9499', '#6d7479'], castle: ['#d6cfee', '#a59ccc', '#ffb35a'], farm: ['#f07a1c', '#c45a10', '#ffcc55'], subway: ['#9fb4dc', '#dca6a0', '#e3c3a6'], cave: ['#cbbfae', '#9a8a78', '#4a3624'], forest: ['#cfb391', '#2f6a3a', '#8a5a2a'], clouds: ['#b7aed6', '#ffffff', '#c9d0ea'], beach: ['#dcc39a', '#3f9a52', '#5a3a20'] }[key];
              debris.emit(o.lane, 0.75, -z, 34, cols, 3.4, 9, 1.3);
              G.shake = reduceMotion ? 0 : 0.18;
              sfx(140, 40, 0.22, 'sawtooth', 0.08); sfx(90, 50, 0.18, 'square', 0.05);
            } else if (!pl.ghost && !safe) { die('wall', o); break; }
          }
        } else if (o.type === 'coin' && !o.taken) {
          if (!pl.ghost && Math.abs(pl.x - o.lane) < 0.5 && Math.abs(z - PZ) < 0.45) {
            o.taken = true; G.coins++;
            if (o.mesh) o.mesh.visible = false;
            sparks.emit(o.lane, 0.55, -z, 12, ['#ffb84d', '#ffe6b0'], 1.6, 2, 0.6, 2);
            sfx(880, 1400, 0.11, 'triangle', 0.05);
          }
        } else if (o.type === 'armor' && !o.taken) {
          if (inLane && Math.abs(z - PZ) < 0.5) {
            o.taken = true; G.armorT = ARMOR_TIME; pl.ghost = false;
            if (o.mesh) o.mesh.visible = false;
            sparks.emit(o.lane, 0.8, -z, 30, ['#79f2cf', '#ffffff'], 2.2, 1, 0.9, 2);
            sfx(200, 500, 0.2, 'square', 0.04); sfx(500, 1000, 0.25, 'triangle', 0.05, 0.12);
          }
        }
      }
    }

    // порывы видно: листья/бумага/солома/угольки несутся поперёк и навстречу
    if (G.state === 'play' || G.state === 'menu') {
      const rate = Math.pow(G.wind, 1.4) * 70 * dt;
      let n = Math.floor(rate) + (Math.random() < rate % 1 ? 1 : 0);
      const bits = LOCS[locIdx(G.dist + 10)].bits;
      while (n-- > 0) {
        const z = -PZ - 6 - Math.random() * 24, y = 0.3 + Math.random() * 3.2;
        leaves.emit(4 + Math.random() * 3, y, z, 1, bits, 0, -0.3, 3.2, 1, [-(3 + G.wind * 7) * (0.7 + Math.random() * 0.6), (Math.random() - 0.5) * 0.6, G.speed * (0.2 + G.wind * 0.6)]);
      }
    }

    const scroll = G.state === 'play' || G.state === 'menu' ? G.speed : 0;
    sparks.update(dt, scroll * 0.6);
    debris.update(dt, scroll);
    leaves.update(dt, scroll);
    G.shake *= Math.pow(0.002, dt);
  }

  // ---------- синхронизация сцены ----------
  const camRun = { y: 2.45, z: 2.5, ly: 0.45, lz: -12 };
  const camFace = { y: 1.3, z: 0.75, ly: 1.3, lz: -6 };
  const lookAt = new THREE.Vector3();
  const tmpQ = new THREE.Quaternion(), zAxis = new THREE.Vector3(0, 0, 1);

  function spring(s, target, k, c, dt) { s.v += (-(s.a - target) * k - s.v * c) * dt; s.a += s.v * dt; }

  function syncScene() {
    const dt = Math.min(0.05, G.dt || 0.016);
    updateWorld(dt);

    const dazed = G.state === 'dying' || G.state === 'over';
    const ghostZ = -PZ + G.knock;
    for (const o of G.objs) {
      const m = o.mesh; if (!m) continue;
      const z = o.w - G.dist;
      m.position.z = zOf(o.w) + (m.userData.dz || 0);
      if (!o.taken) m.visible = dazed ? zOf(o.w) < ghostZ - 0.35 : true;
      // объекты вдали плавно «вырастают», чтобы не выскакивать из тумана
      m.scale.setScalar(Math.max(0.001, Math.min(1, (FAR - z) / 12)));
      if (o.type === 'coin') m.userData.spin.rotation.y = T * 3 + o.w;
      if (m.userData.person) m.userData.person.rotation.z = Math.sin(T * 1.4 + o.w) * 0.035;
      if (o.type === 'armor') {
        const p = 0.5 + 0.5 * Math.sin(T * 5);
        m.userData.ring.scale.setScalar(1 + 0.08 * p);
        m.userData.glow.material.opacity = 0.2 + 0.2 * p;
        m.userData.knight.position.y = 0.15 + Math.sin(T * 2 + o.w) * 0.06;
      }
    }
    M.coin.opacity = M.coinRim.opacity = 1 - 0.45 * pl.phase;

    const armored = G.armorT > 0 && !dazed;
    player.position.set(pl.x, 0, ghostZ);
    const bob = dazed ? Math.sin(T * 2.5) * 0.03 : Math.sin(T * 5) * 0.06;

    // наклон привидения — пружина: отстаёт от движения и слегка перелетает
    const leanTarget = dazed ? Math.sin(T * 3.2) * 0.12 : Math.max(-0.4, Math.min(0.4, -pl.vx * 0.045));
    const ls = { a: pl.lean, v: pl.leanV }; spring(ls, leanTarget, 140, 12, dt); pl.lean = ls.a; pl.leanV = ls.v;

    ghostG.visible = !armored;
    knight.g.visible = armored;
    if (armored) {
      // летящий рыцарь-марионетка: конечности на пружинах тянутся за движением и полощутся на ветру
      knight.g.position.y = 0.32 + Math.sin(T * 3) * 0.07;
      knight.g.rotation.z = pl.vx * 0.035;
      knight.head.rotation.z = -pl.vx * 0.02;
      for (const l of limbs) {
        const tz = l.base + pl.vx * (l.arm ? 0.11 : 0.08) + Math.sin(T * (2.3 + G.wind * 4) + l.base * 9) * (0.05 + G.wind * 0.06);
        const tx = l.fwd + G.wind * 0.25 + Math.sin(T * 3 + l.base * 5) * 0.06;
        const sz = { a: l.az, v: l.vz }; spring(sz, tz, l.arm ? 55 : 40, 4.5, dt); l.az = sz.a; l.vz = sz.v;
        const sx = { a: l.ax, v: l.vxa }; spring(sx, tx, 40, 4, dt); l.ax = sx.a; l.vxa = sx.v;
        l.p.rotation.set(l.ax, 0, l.az);
      }
      knight.g.visible = !(G.armorT < 1.3 && Math.sin(T * 30) > 0.3);
      blob.scale.setScalar(0.9);
    } else blob.scale.setScalar(1);

    waveHem();
    ghostG.position.y = 0.26 + bob;
    ghostG.rotation.y = Math.PI * (1 - pl.face);
    leanG.rotation.z = pl.lean;
    leanG.rotation.x = dazed ? 0 : -(0.12 + G.wind * 0.14) * (1 - pl.face);
    const sq = pl.squash;
    ghostG.scale.set(1 + 0.14 * sq, 1 - 0.1 * sq, 1 + 0.06 * sq);

    // форма: плотное тело ↔ только светящийся контур
    const ph = pl.phase;
    const blink = G.grace > 0 && Math.sin(T * 30) > 0 ? 0.35 : 1;
    ghostMat.opacity = Math.max(0, 1 - ph * 1.15) * blink;
    ghostBody.visible = ghostMat.opacity > 0.01;
    ghostMat.depthWrite = ph < 0.3;
    inkMat.opacity = whiteMat.opacity = 1 - 0.25 * ph;
    inkMat.color.copy(ph > 0.5 ? MINT : INK);
    ghostGlow.material.opacity = 0.16 * ph;
    ghostLight.intensity = 1.4 * ph;
    blob.material.opacity = 0.55 * (1 - 0.7 * ph);

    outline.visible = ph > 0.02 && !armored;
    if (outline.visible) {
      updateOutline();
      outlineMat.opacity = Math.min(1, ph * 1.2) * blink;
      outline.position.set(pl.x, ghostG.position.y, ghostZ);
      outline.quaternion.copy(camera.quaternion);
      tmpQ.setFromAxisAngle(zAxis, pl.lean); outline.quaternion.multiply(tmpQ);
      outline.scale.set(1 + 0.14 * sq, 1 - 0.1 * sq, 1);
    }

    face.visible = pl.face > 0.15;
    const sad = dazed;
    mouth.rotation.z = sad ? 0 : Math.PI;
    mouth.position.y = sad ? 0.25 : 0.33;
    parts.brows.forEach(b => { b.visible = sad; });
    parts.blush.forEach(b => { b.visible = !sad && ph < 0.5; });
    tear.visible = sad;
    if (sad) { const ty = (T * 0.9) % 1; tear.position.y = 0.38 - ty * 0.2; tear.scale.setScalar(1 - ty * 0.6); }

    birds.forEach((b, i) => {
      b.visible = dazed;
      if (!dazed) return;
      const a = T * 2.6 + i * 2.094;
      b.position.set(Math.cos(a) * 0.48, 0.26 + bob + 0.98 + Math.sin(a * 2) * 0.04, Math.sin(a) * 0.48);
      b.rotation.y = -a;
      const flap = Math.sin(T * 18 + i * 2) * 0.8;
      b.userData.wings[0].rotation.z = flap; b.userData.wings[1].rotation.z = -flap;
    });

    // камера: в беге — сзади и сверху с мягким догоном по x; в меню и после удара — ближе, лицом к привидению
    pl.camX += (pl.x - pl.camX) * Math.min(1, dt * 7);
    const f = pl.face;
    const mix = (a, b) => a + (b - a) * f;
    let sx = 0, sy = 0;
    if (G.shake > 0.005) { sx = (Math.random() - 0.5) * G.shake; sy = (Math.random() - 0.5) * G.shake; }
    // лёгкая дрожь камеры в сильный порыв
    const gust = Math.max(0, G.wind - 0.6) * (1 - f);
    sx += Math.sin(T * 23) * gust * 0.03; sy += Math.sin(T * 31) * gust * 0.02;
    camera.position.set(mix(pl.camX * 0.55, pl.x * 0.7) + sx, mix(camRun.y, camFace.y) + sy, mix(camRun.z, camFace.z) + G.knock);
    lookAt.set(mix(pl.camX * 0.35, pl.x), mix(camRun.ly, camFace.ly), mix(camRun.lz, camFace.lz) + G.knock);
    camera.lookAt(lookAt);
    camera.rotateZ(-(pl.lane - pl.x) * 0.04 * (1 - f));
    // чем сильнее ветер, тем шире угол обзора — ощущение скорости
    const fov = baseFov + G.wind * 7 * (1 - f);
    if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }

    // полосы ветра
    const sOp = Math.max(0, G.wind - 0.35) * 0.55 * (1 - f);
    streakMat.opacity = sOp;
    if (sOp > 0.001) {
      const vx = -(4 + G.wind * 10), vz = G.speed * (0.6 + G.wind);
      for (let i = 0; i < STREAKS; i++) {
        const s = streakData[i];
        s.x += vx * dt; s.z += vz * dt;
        if (s.z > camera.position.z - 0.5 || s.x < -6) { s.x = 3 + Math.random() * 6; s.y = 0.4 + Math.random() * 3.5; s.z = camera.position.z - 4 - Math.random() * 22; }
        const L = 0.09 + G.wind * 0.06;
        streakPos[i * 6] = s.x; streakPos[i * 6 + 1] = s.y; streakPos[i * 6 + 2] = s.z;
        streakPos[i * 6 + 3] = s.x - vx * L; streakPos[i * 6 + 4] = s.y; streakPos[i * 6 + 5] = s.z - vz * L;
      }
      streakGeo.attributes.position.needsUpdate = true;
    }

    // небо, луна, горы и море тумана держатся вокруг камеры — бесконечно далеко
    sky.position.copy(camera.position);
    stars.position.copy(camera.position);
    mountains.position.set(camera.position.x, 0, camera.position.z);
    moon.position.set(camera.position.x + 90, camera.position.y + 120, camera.position.z - 420);
    sea.position.set(camera.position.x, -16, camera.position.z - 200);
    moonLight.position.set(pl.x + 30, 50, ghostZ - 120); moonLight.target.position.set(pl.x, 0, ghostZ);
    keyLight.position.set(pl.x + 4, 8, ghostZ + 10); keyLight.target.position.set(pl.x, 0, ghostZ - 6);
    fill.position.set(pl.x, 2.2, ghostZ + 1.2);
    if (finalPass) finalPass.uniforms.seed.value = (T * 61.7) % 100;

    // звук ветра
    if (windGain && ac) {
      const v = muted || G.state === 'paused' ? 0 : 0.015 + G.wind * G.wind * 0.09;
      windGain.gain.setTargetAtTime(v, ac.currentTime, 0.3);
      windFilter.frequency.setTargetAtTime(250 + G.wind * 900, ac.currentTime, 0.3);
    }
  }

  // ---------- HUD ----------
  // колдунчик собирается из пяти вложенных полос: каждая поворачивается относительно предыдущей
  const SVGNS = 'http://www.w3.org/2000/svg';
  const sockParts = [];
  {
    let parent = ui.sock;
    for (let i = 0; i < 5; i++) {
      const g = document.createElementNS(SVGNS, 'g');
      const h0 = 6.4 - i * 0.75, h1 = 6.4 - (i + 1) * 0.75;
      const p = document.createElementNS(SVGNS, 'polygon');
      p.setAttribute('points', `0,${-h0} 11.2,${-h1} 11.2,${h1} 0,${h0}`);
      p.setAttribute('fill', i % 2 ? '#f1ebdd' : '#ff7a2e');
      g.appendChild(p); parent.appendChild(g);
      sockParts.push(g); parent = g;
    }
  }
  function drawSock(w) {
    // сила ветра 0..5: целые полосы надуты и стоят горизонтально, следующая — на полпути, остальные свисают вниз
    const L = w * 5;
    let prev = 0;
    sockParts.forEach((g, i) => {
      const f = Math.max(0, Math.min(1, L - i));
      const flutter = Math.sin(T * (5 + w * 9) + i * 1.3) * (1.2 + w * 3) * f + Math.sin(T * 1.6 + i) * 2.5 * (1 - f);
      const abs = 80 * (1 - f) + flutter - f * 3;
      const rel = i === 0 ? abs : abs - prev;
      g.setAttribute('transform', i === 0 ? `rotate(${rel.toFixed(1)})` : `translate(11.2 0) rotate(${rel.toFixed(1)})`);
      prev = abs;
    });
  }
  const RING_C = 2 * Math.PI * 32;

  let lastScore = -1, lastCoins = -1, lastMode = null, lastLevel = null, lastPct = -1;
  function hud() {
    drawSock(G.wind);
    if (G.state !== 'play') return;
    const s = scoreOf();
    if (s !== lastScore) { ui.score.textContent = s; lastScore = s; }
    if (G.coins !== lastCoins) { ui.coins.textContent = G.coins; lastCoins = G.coins; }
    const pct = Math.round(G.energy * 100);
    if (pct !== lastPct) {
      ui.ringArc.setAttribute('stroke-dashoffset', (RING_C * (1 - G.energy)).toFixed(2));
      ui.ringVal.textContent = pct;
      ui.ring.classList.toggle('low', G.energy < 0.25);
      lastPct = pct;
    }
    ui.ring.classList.toggle('ghost', pl.ghost);
    // плашка внизу появляется только на время доспехов — с обратным отсчётом
    const mode = G.armorT > 0 ? 'armor:' + Math.ceil(G.armorT) : 'none';
    if (mode !== lastMode) {
      ui.chip.hidden = G.armorT <= 0;
      if (G.armorT > 0) ui.chip.textContent = `Armor · ${Math.ceil(G.armorT)}`;
      lastMode = mode;
    }
    const lv = locIdx(G.dist + PZ) + ':' + stageOf(G.dist + PZ);
    if (lv !== lastLevel) {
      ui.levelName.textContent = LOCS[locIdx(G.dist + PZ)].name;
      const st = stageOf(G.dist + PZ);
      ui.dots.forEach((d, i) => d.classList.toggle('on', i <= st));
      lastLevel = lv;
    }
  }

  // ---------- цикл ----------
  new ResizeObserver(resize).observe(root);
  resize();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (G.state !== 'paused') {
      T += dt;
      update(dt);
    } else G.dt = 0;
    syncScene();
    if (composer) composer.render(); else renderer.render(scene, camera);
    hud();
    requestAnimationFrame(frame);
  }
  reset(selLevel);
  G.state = 'menu';
  G.speed = 6;
  renderLevels();
  previewLevel(selLevel);
  requestAnimationFrame(frame);
})();
</script>

</body>
