<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0916">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ghost Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=Russo+One&family=Tilt+Neon&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<style>
:root{color-scheme:dark}
html,body{height:100%}
body{background:#0b0916;margin:0;overflow:hidden}
html,body{height:100dvh}
/* скрытые экраны должны прятаться и без обёртки артефакта (на GitHub Pages её нет) */
[hidden]{display:none!important}

/* Мобильный раннер на один экран: WebGL-canvas на весь экран, HUD и экраны поверх. */
#cr{
  --night:#0b0916;
  --panel:rgba(16,12,32,.8);
  --line:rgba(241,235,221,.14);
  --bone:#f1ebdd;
  --muted:#aaa3c6;
  --ecto:#79f2cf;
  --amber:#ffb84d;
  --sock:#ff7a2e;
  --steel:#cfd4de;
  --danger:#ff7a7a;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif;
  --f-neon:"Tilt Neon","Russo One",system-ui,sans-serif;
  --f-body:"Exo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  position:relative;width:100%;height:100%;min-height:480px;overflow:hidden;
  background:var(--night);color:var(--bone);font:15px/1.45 var(--f-body);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;outline:none;cursor:pointer;
}
#cr *{box-sizing:border-box}
#cr canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

#cr .cr-hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;pointer-events:none}
#cr .cr-score{font:400 30px/1 var(--f-display);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.45)}
#cr .cr-coins{margin-top:8px;display:flex;align-items:center;gap:7px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums}
#cr .cr-coin-ic{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe6b0,var(--amber) 55%,#b8700f);box-shadow:0 0 8px rgba(255,184,77,.5)}
#cr .cr-level{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#cr .cr-dots{display:flex;gap:3px}
#cr .cr-dots i{width:6px;height:6px;border-radius:50%;background:rgba(241,235,221,.18)}
#cr .cr-dots i.on{background:var(--bone)}
#cr .cr-right{display:flex;align-items:flex-start;gap:12px}
#cr .cr-energy{width:min(34vw,150px);padding-top:2px}
#cr .cr-energy-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;text-align:right}
#cr .cr-bar{height:8px;border-radius:99px;background:rgba(241,235,221,.12);overflow:hidden}
#cr .cr-bar i{display:block;height:100%;width:100%;background:var(--ecto);border-radius:inherit;box-shadow:0 0 10px var(--ecto);transform-origin:left center}
#cr .cr-bar.low i{background:var(--danger);box-shadow:0 0 10px var(--danger)}
#cr .cr-bar.nope{animation:cr-nope .32s}
@keyframes cr-nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#cr .cr-wind{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
#cr .cr-wind svg{width:128px;height:113px;overflow:visible;display:block}
#cr .cr-ring{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:76px;height:76px;pointer-events:none;display:grid;place-items:center;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
#cr .cr-ring svg{position:absolute;inset:0;width:100%;height:100%}
#cr .cr-ring #cr-ring-arc{transition:stroke .2s}
#cr .cr-ring b{position:relative;font:400 20px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--bone)}
#cr .cr-ring b::after{content:'%';font-size:10px;margin-left:1px;opacity:.7}
#cr .cr-ring.low #cr-ring-arc{stroke:var(--danger)}
#cr .cr-ring.ghost b{color:var(--ecto)}
#cr .cr-ring.nope{animation:cr-nope .32s}
#cr .cr-icon-btn{pointer-events:auto;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(16,12,32,.55);color:var(--bone);display:grid;place-items:center;cursor:pointer;padding:0}
#cr .cr-icon-btn svg{width:18px;height:18px}
#cr .cr-icon-btn .off{display:none}
#cr .cr-icon-btn.muted .on{display:none}
#cr .cr-icon-btn.muted .off{display:block}

#cr .cr-chip{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 16px;border-radius:99px;font:400 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);background:rgba(16,12,32,.6);pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .15s,border-color .15s,box-shadow .15s}
#cr .cr-chip.is-ghost{color:var(--ecto);border-color:rgba(121,242,207,.55);box-shadow:0 0 18px rgba(121,242,207,.25)}
#cr .cr-chip.is-armor{color:var(--steel);border-color:rgba(207,212,222,.6);box-shadow:0 0 18px rgba(121,242,207,.2)}

#cr .cr-toast{position:absolute;left:50%;top:19%;padding:10px 18px 12px;border-radius:14px;background:rgba(16,12,32,.72);border:1px solid var(--line);text-align:center;pointer-events:none;white-space:nowrap;animation:cr-toast 2.6s ease forwards}
#cr .cr-toast span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#cr .cr-toast b{display:block;margin-top:5px;font:400 20px/1.1 var(--f-display);letter-spacing:.04em}
@keyframes cr-toast{0%{opacity:0;transform:translate(-50%,-10px)}12%{opacity:1;transform:translate(-50%,0)}78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}

/* игровые экраны: без карточек, всё по центру; мир виден сквозь мягкое затемнение */
#cr .cr-screen{position:absolute;inset:0;display:grid;place-items:start center;padding:max(18px,6vh) 16px 16px;background:radial-gradient(120% 70% at 50% 28%,rgba(8,6,18,.82),rgba(8,6,18,.35) 60%,rgba(8,6,18,0) 85%);cursor:default;text-align:center}
#cr .cr-front{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;animation:cr-in .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cr-in{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}

/* заголовок экрана уровней — матовый неон, как вывеска */
#cr .cr-logo{margin:-6px 0 0;width:min(100%,380px);line-height:0;animation:cr-logo 4s ease-in-out infinite}
#cr .cr-logo img{width:100%;height:auto;display:block;pointer-events:none;-webkit-user-select:none;user-select:none;filter:drop-shadow(0 0 18px rgba(110,160,255,.35))}
@keyframes cr-logo{50%{transform:translateY(-4px)}}
#cr .cr-title{margin:0;font:400 clamp(56px,17vw,80px)/1 var(--f-neon);letter-spacing:.03em;color:rgba(190,255,236,.38);-webkit-text-stroke:1.4px rgba(186,255,234,.85);
  text-shadow:0 0 4px rgba(121,242,207,.95),0 0 14px rgba(121,242,207,.7),0 0 34px rgba(121,242,207,.45),0 0 70px rgba(121,242,207,.25);animation:cr-flicker 6s infinite}
@keyframes cr-flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.55}}

/* уровни */
#cr .cr-levels{margin-top:22px;width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
#cr .cr-lvl{position:relative;min-width:0;aspect-ratio:1/1;border-radius:14px;border:1.5px solid rgba(241,235,221,.18);padding:0;overflow:hidden;cursor:pointer;background:#0d0b1a;box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .12s}
#cr .cr-lvl:active{transform:translateY(2px)}
#cr .cr-lvl .thumb{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;pointer-events:none;-webkit-user-select:none;user-select:none}
#cr .cr-lvl .num{position:absolute;left:5px;top:4px;font:400 12px/1 var(--f-display);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#cr .cr-lvl.sel{border-color:var(--ecto);box-shadow:0 4px 0 #1e6b58,0 0 18px rgba(121,242,207,.5),inset 0 0 0 1px var(--ecto);animation:cr-sel 1.8s ease-in-out infinite}
#cr .cr-lvl.sel .num{color:var(--ecto)}
@keyframes cr-sel{50%{box-shadow:0 4px 0 #1e6b58,0 0 30px rgba(121,242,207,.75),inset 0 0 0 1px var(--ecto)}}
#cr .cr-lvl:disabled{cursor:not-allowed;border-color:rgba(241,235,221,.08)}
#cr .cr-lvl:disabled .thumb{filter:grayscale(1) brightness(.35) blur(1.2px)}
#cr .cr-lvl .lock{position:absolute;inset:0;display:grid;place-items:center;color:rgba(241,235,221,.75)}
#cr .cr-lvl .lock svg{width:18px;height:20px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
#cr .cr-lvl-count{margin:10px 0 0;font:700 11px/1 var(--f-body);letter-spacing:.2em;color:var(--muted);font-variant-numeric:tabular-nums}

/* кнопки: объёмные «игровые» */
#cr .cr-btn{width:100%;margin-top:22px;padding:14px 16px 12px;border:0;border-radius:18px;cursor:pointer;font:400 22px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:#062a20;
  background:linear-gradient(180deg,#a8ffe6,#5fe3bd 55%,#3fcaa3);box-shadow:0 6px 0 #1e7a62,0 10px 24px rgba(0,0,0,.45),0 0 32px rgba(121,242,207,.35),inset 0 2px 0 rgba(255,255,255,.55);transition:transform .1s,box-shadow .1s}
#cr .cr-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1e7a62,0 6px 14px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.55)}
#cr .cr-btn-play{display:flex;flex-direction:column;align-items:center;gap:5px;animation:cr-pulse 2.2s ease-in-out infinite}
#cr .cr-btn-main{display:block}
#cr .cr-btn-sub{display:block;font:800 10px/1 var(--f-body);letter-spacing:.2em;opacity:.7}
@keyframes cr-pulse{50%{box-shadow:0 6px 0 #1e7a62,0 10px 24px rgba(0,0,0,.45),0 0 52px rgba(121,242,207,.6),inset 0 2px 0 rgba(255,255,255,.55)}}
#cr .cr-btn-ghost{margin-top:12px;padding:12px;font-size:16px;color:var(--bone);background:rgba(255,255,255,.06);border:1.5px solid rgba(241,235,221,.2);box-shadow:0 4px 0 rgba(0,0,0,.4);animation:none}
#cr .cr-btn-ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.4)}
#cr button:focus-visible{outline:2px solid var(--bone);outline-offset:4px}
#cr .cr-best{margin:14px 0 0;display:flex;align-items:center;gap:7px;font:400 16px/1 var(--f-display);color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,184,77,.4)}
#cr .cr-best svg{width:18px;height:18px}
#cr .cr-error{margin:14px 0 0;color:var(--danger);font-size:13px}

/* экран проигрыша */
#cr .cr-ko{margin:6px 0 0;font:400 clamp(44px,13vw,62px)/1 var(--f-display);text-transform:uppercase;color:#ffd9e2;transform:rotate(-4deg);
  text-shadow:0 3px 0 #ff6f91,0 6px 0 #b8325a,0 10px 18px rgba(0,0,0,.55);animation:cr-ko .55s cubic-bezier(.2,1.6,.4,1) both}
#cr .cr-ko-calm{color:#f4efe2;text-shadow:0 3px 0 #a99fc9,0 6px 0 #6f6596,0 10px 18px rgba(0,0,0,.55);transform:none;animation:none}
@keyframes cr-ko{0%{transform:rotate(-14deg) scale(1.8);opacity:0}100%{transform:rotate(-4deg) scale(1);opacity:1}}
#cr .cr-big{margin-top:18px;display:flex;flex-direction:column;align-items:center}
#cr .cr-big b{font:400 clamp(58px,17vw,84px)/1 var(--f-display);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 22px rgba(121,242,207,.55),0 4px 0 rgba(0,0,0,.35)}
#cr .cr-big span{margin-top:4px;font:700 11px/1 var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
#cr .cr-badge{margin:14px 0 0;padding:7px 14px 6px;border-radius:99px;font:400 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:#2a1600;background:linear-gradient(90deg,#ffcf6a,#fff2b8,#ffcf6a);background-size:200% 100%;box-shadow:0 0 22px rgba(255,200,90,.6);animation:cr-shine 1.6s linear infinite,cr-in .5s cubic-bezier(.2,1.6,.4,1) .35s both}
@keyframes cr-shine{to{background-position:-200% 0}}
#cr .cr-pills{margin-top:16px;display:flex;justify-content:center;gap:10px}
#cr .cr-pill{display:flex;align-items:center;gap:8px;padding:9px 16px 8px;border-radius:99px;background:rgba(255,255,255,.07);border:1.5px solid rgba(241,235,221,.14);font:400 18px/1 var(--f-display);color:var(--bone);font-variant-numeric:tabular-nums}
#cr .cr-pill.coin b{color:var(--amber)}
#cr .cr-pill svg{width:18px;height:18px}
#cr .cr-pill .cr-coin-ic{width:16px;height:16px;display:block}
#cr .cr-unlock{margin:14px 0 0;font:700 13px/1.3 var(--f-body);letter-spacing:.06em;color:var(--ecto);text-shadow:0 0 10px rgba(121,242,207,.5)}
</style>
</head>
<body>


<div id="cr" tabindex="0" aria-label="Ghost Runner game">
  <canvas></canvas>

  <div class="cr-hud" hidden>
    <div>
      <div class="cr-score" id="cr-score">0</div>
      <div class="cr-coins"><span class="cr-coin-ic"></span><span id="cr-coins">0</span></div>
      <div class="cr-level"><span id="cr-level-name">City</span><span class="cr-dots" id="cr-dots"><i></i><i></i><i></i><i></i><i></i></span></div>
    </div>
    <div class="cr-right">
      <button class="cr-icon-btn" id="cr-mute" type="button" aria-label="Sound">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
  </div>

  <!-- колдунчик: крупный, в левом нижнем углу -->
  <!-- колдунчик: надутые ветром полосы стоят горизонтально, остальные свисают (полосы собираются в JS) -->
  <div class="cr-wind" id="cr-wind" aria-label="Wind strength" hidden>
    <svg viewBox="-4 -8 70 62" aria-hidden="true">
      <line x1="2" y1="2" x2="2" y2="30" stroke="#c9c2e0" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="2" cy="2.5" r="2.4" fill="#f1ebdd"/>
      <g id="cr-sock" transform="translate(3 3)"></g>
    </svg>
  </div>

      <circle cx="40" cy="40" r="32" fill="rgba(16,12,32,.55)" stroke="rgba(241,235,221,.14)" stroke-width="7"/>
      <circle id="cr-ring-arc" cx="40" cy="40" r="32" fill="none" stroke="#79f2cf" stroke-width="7" stroke-linecap="round" transform="rotate(-90 40 40)" stroke-dasharray="201.06" stroke-dashoffset="0"/>
    </svg>
    <b id="cr-ring-val">100</b>
  </div>

  <div class="cr-chip is-armor" id="cr-chip" hidden>Armor</div>
  <div class="cr-toast" id="cr-toast" hidden><span id="cr-toast-sub">Level 1</span><b id="cr-toast-name">City</b></div>

<script>
(() => {
  const root = document.getElementById('cr');
  const cv = root.querySelector('canvas');
  const $ = id => document.getElementById(id);
  const ui = {
    hud: root.querySelector('.cr-hud'), score: $('cr-score'), coins: $('cr-coins'),
    ring: $('cr-ring'), ringArc: $('cr-ring-arc'), ringVal: $('cr-ring-val'), chip: $('cr-chip'), mute: $('cr-mute'),
    levels: $('cr-levels'), lvlCount: $('cr-lvl-count'), play: $('cr-play'), unlocked: $('cr-unlocked'),
    toast: $('cr-toast'), toastName: $('cr-toast-name'), toastSub: $('cr-toast-sub'),
    levelName: $('cr-level-name'), dots: Array.from($('cr-dots').children),
    wind: $('cr-wind'), sock: $('cr-sock'),
    menu: $('cr-menu'), over: $('cr-over'), pause: $('cr-pause'), best: $('cr-best'),
    playSub: $('cr-play-sub'), fScore: $('cr-f-score'), fCoins: $('cr-f-coins'), fBest: $('cr-f-best'), newBest: $('cr-newbest')
  };
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const THREE = window.THREE;
  let renderer;
  try {
    if (!THREE) throw new Error('no three');
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
  } catch (e) {
    $('cr-error').hidden = false; $('cr-play').disabled = true;
    return;
  }

  // ---------- рендер и постобработка ----------
  const PR = Math.min(1.75, window.devicePixelRatio || 1);
  renderer.setPixelRatio(PR);
  const usePost = !!(THREE.EffectComposer && THREE.RenderPass && THREE.UnrealBloomPass && THREE.ShaderPass && THREE.CopyShader && THREE.LuminosityHighPassShader);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = usePost ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const C = h => new THREE.Color(h).convertSRGBToLinear();
  const HDR = (h, k) => C(h).multiplyScalar(k);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(C('#1c2b4c'), 45, 260);
  const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 900);

  // финальный проход: ACES-тонмаппинг, sRGB, виньетка и лёгкий дизеринг против полос в тёмных градиентах
  const FINAL_SHADER = {
    uniforms: { tDiffuse: { value: null }, exposure: { value: 1.15 }, vignette: { value: 0.42 }, seed: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: [
      'uniform sampler2D tDiffuse; uniform float exposure; uniform float vignette; uniform float seed; varying vec2 vUv;',
      'vec3 RRTAndODTFit(vec3 v){ vec3 a = v * (v + 0.0245786) - 0.000090537; vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081; return a / b; }',
      'vec3 aces(vec3 c){',
      '  const mat3 I = mat3(vec3(0.59719,0.07600,0.02840), vec3(0.35458,0.90834,0.13383), vec3(0.04823,0.01566,0.83777));',
      '  const mat3 O = mat3(vec3(1.60475,-0.10208,-0.00327), vec3(-0.53108,1.10813,-0.07276), vec3(-0.07367,-0.00605,1.07602));',
      '  c *= exposure / 0.6; c = I * c; c = RRTAndODTFit(c); c = O * c; return clamp(c, 0.0, 1.0); }',
      'vec3 toSRGB(vec3 c){ return mix(pow(c, vec3(0.41666)) * 1.055 - vec3(0.055), c * 12.92, vec3(lessThanEqual(c, vec3(0.0031308)))); }',
      'float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + seed) * 43758.5453); }',
      'void main(){',
      '  vec3 c = aces(texture2D(tDiffuse, vUv).rgb);',
      '  vec2 d = vUv - 0.5; c *= clamp(1.0 - dot(d, d) * vignette * 2.4, 0.0, 1.0);',
      '  c = toSRGB(c) + (rnd(vUv) - 0.5) / 255.0;',
      '  gl_FragColor = vec4(c, 1.0); }'
    ].join('\n')
  };

  let composer = null, bloom = null, finalPass = null;
  if (usePost) {
    try {
      const gl2 = renderer.capabilities.isWebGL2;
      const canHalf = gl2 && renderer.extensions.has('EXT_color_buffer_float');
      const rt = new THREE.WebGLRenderTarget(4, 4, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: canHalf ? THREE.HalfFloatType : THREE.UnsignedByteType });
      composer = new THREE.EffectComposer(renderer, rt);
      composer.addPass(new THREE.RenderPass(scene, camera));
      bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), 0.95, 0.55, canHalf ? 0.85 : 0.5);
      composer.addPass(bloom);
      finalPass = new THREE.ShaderPass(FINAL_SHADER);
      composer.addPass(finalPass);
    } catch (e) {
      composer = null;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
    }
  }

  let baseFov = 60;
  function resize() {
    const r = root.getBoundingClientRect();
    const w = Math.max(1, r.width), h = Math.max(1, r.height);
    renderer.setSize(w, h, false);
    if (composer) {
      composer.setPixelRatio(PR);
      composer.setSize(w, h);
      bloom.setSize(Math.round(w * PR / 2), Math.round(h * PR / 2));
    }
    camera.aspect = w / h;
    const hfov = 57 * Math.PI / 180;
    const vfov = 2 * Math.atan(Math.tan(hfov / 2) / camera.aspect) * 180 / Math.PI;
    baseFov = Math.max(50, Math.min(84, vfov));
    camera.fov = baseFov;
    camera.updateProjectionMatrix();
  }

  // Мир: x — полосы (-1, 0, 1), y — вверх, вперёд — минус z. Дистанция w в логике = -z в сцене.
  const PZ = 1.3, FAR = 100, TILES_AHEAD = 135, WORLD_AHEAD = 320, HALF = 1.75, TL = 9, LOC_LEN = 846, CL = 47;
  const STAGE_LEN = LOC_LEN / 5;
  let WIND = 0; // текущая сила ветра 0..1, доступна моделям ещё до создания состояния игры
  const ARMOR_TIME = 6;
  const zOf = w => -(w - G.dist);
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  let seed = 1;
  const srand = s => { seed = (Math.floor(s * 9301 + 49297) % 233280) || 1; };
  const rr = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };

  // ---------- пять уровней ----------
  const LOCS = [
    { key: 'city', name: 'City', top: '#03050c', fog: '#1c2b4c', low: '#0b1222', mount: '#0f182c', path: '#30343f', side: '#13161e', edge: '#62d6ff', death: 'Hit a concrete block', bits: ['#d8dce6', '#a9b1c2'] },

    { key: 'cemetery', name: 'Cemetery', top: '#04050a', fog: '#26303a', low: '#0d1217', mount: '#121a20', path: '#3f3e3b', side: '#191918', edge: '#8affd8', death: 'Hit a tombstone', bits: ['#b08a5a', '#8a6a44', '#c9a46a'] },
    { key: 'castle', name: 'Castle', top: '#05040f', fog: '#2a2452', low: '#120f26', mount: '#151129', path: '#4b4470', side: '#1c1731', edge: '#ffb35a', death: 'Hit a column', bits: ['#ffb35a', '#ff8a3a'] },

        for (let r = 0; r < rows; r++) {

          while (x < w) {

            g.fillStyle = `rgba(0,0,0,${0.03 + rr() * 0.08})`; g.fillRect(x, (r * h) / rows, sw, h / rows);

        const dots = key === 'cave' ? 2200 : 1400;

        for (let i = 0; i < 260; i++) { const r = 8 + rr() * 22; const gr = g.createRadialGradient(0, 0, 0, 0, 0, r); gr.addColorStop(0, 'rgba(255,255,255,.18)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.save(); g.translate(rr() * w, rr() * h); g.fillStyle = gr; g.fillRect(-r, -r, r * 2, r * 2); g.restore(); }

    hill: new THREE.SphereGeometry(1, 14, 8),
    tree: new THREE.ConeGeometry(1, 1, 7),
    groundStrip: new THREE.PlaneGeometry(700, CL),
    pillar: new THREE.BoxGeometry(0.5, 7, 0.6),
    lintel: new THREE.BoxGeometry(5, 0.6, 0.6),
    gateEdge: new THREE.BoxGeometry(0.05, 6.4, 0.05),
    sign: new THREE.PlaneGeometry(2.9, 0.4),
    block: new THREE.BoxGeometry(0.92, 1.5, 0.45),
    rune: new THREE.PlaneGeometry(0.56, 0.04),
    pool: new THREE.CircleGeometry(0.75, 32),
    coin: new THREE.CylinderGeometry(0.19, 0.19, 0.05, 28),
    coinFace: new THREE.CylinderGeometry(0.12, 0.12, 0.058, 24),
    ring: new THREE.TorusGeometry(0.45, 0.02, 8, 48),
    blob: new THREE.CircleGeometry(0.42, 24),
    tomb: tombGeo(0.82, 1.45, 0.2),
    tombSmall: tombGeo(0.5, 0.75, 0.12),
    colBase: new THREE.BoxGeometry(0.82, 0.16, 0.82),
    colShaft: new THREE.CylinderGeometry(0.28, 0.32, 1.5, 16),
    colRing: new THREE.TorusGeometry(0.3, 0.025, 6, 24),
    pumpkin: pumpkinGeo(),
    pumpEye: triShape([-0.07, -0.05, 0.07, -0.05, 0, 0.07]),
    pumpMouth: triShape([-0.18, 0.02, 0.18, 0.02, 0.12, -0.06, 0.06, -0.02, 0, -0.08, -0.06, -0.02, -0.12, -0.06]),
    spike: new THREE.ConeGeometry(0.025, 0.12, 4),
    hayBale: new THREE.CylinderGeometry(0.45, 0.45, 0.8, 14),
    torso: (() => {
      // торс пассажира: мягкая «капсула», без лиц и деталей — аккуратный стилизованный силуэт
      const pr = [[0.001, 0], [0.16, 0.02], [0.2, 0.12], [0.21, 0.4], [0.19, 0.56], [0.12, 0.64], [0.001, 0.66]].map(p => new THREE.Vector2(p[0], p[1]));
      return new THREE.LatheGeometry(pr, 20);
    })(),
    limb: new THREE.CylinderGeometry(0.055, 0.06, 1, 10),
    headS: new THREE.SphereGeometry(0.13, 18, 14),
    octa: new THREE.OctahedronGeometry(1, 0),
    handle: new THREE.TorusGeometry(0.06, 0.012, 6, 16),
    cloudPuff: new THREE.IcosahedronGeometry(1, 2),
    leaf: (() => { const g = new THREE.PlaneGeometry(0.22, 1.1, 1, 4); g.translate(0, 0.55, 0); const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setZ(i, -y * y * 0.35); p.setX(i, p.getX(i) * (1 - y * 0.6)); } g.computeVertexNormals(); return g; })(),
    blade: new THREE.BoxGeometry(0.5, 5, 0.08),
    rocks: [0, 1, 2].map(i => {
      const g = new THREE.IcosahedronGeometry(1, 1);
      const p = g.attributes.position;
      const seen = new Map();
      for (let v = 0; v < p.count; v++) {
        const key = `${p.getX(v).toFixed(3)},${p.getY(v).toFixed(3)},${p.getZ(v).toFixed(3)}`;
        let f = seen.get(key);
        if (f === undefined) { f = 0.78 + hash(v * 3.7 + i * 17) * 0.38; seen.set(key, f); }
        p.setXYZ(v, p.getX(v) * f, p.getY(v) * f, p.getZ(v) * f);
      }
      g.computeVertexNormals();
      return g;
    })
  };

  // ---------- небо, луна, звёзды, горы, море тумана ----------
  const skyMat = new THREE.ShaderMaterial({
    uniforms: { top: { value: atmo.top }, mid: { value: atmo.fog }, low: { value: atmo.low } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: [
      'uniform vec3 top; uniform vec3 mid; uniform vec3 low; varying vec3 vP;',
      'void main(){',
      '  float h = vP.y;',
      '  vec3 c = h > 0.0 ? mix(mid, top, smoothstep(0.0, 0.5, h)) : mix(mid, low, smoothstep(0.0, -0.25, h));',
      '  gl_FragColor = vec4(c, 1.0);',
      '  #include <tonemapping_fragment>',
      '  #include <encodings_fragment>',
      '}'
    ].join('\n'),
    side: THREE.BackSide, depthWrite: false, fog: false
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(700, 32, 16), skyMat);
  sky.renderOrder = -10; scene.add(sky);

  const moonTex = canvasTex(256, 256, (g, w) => {
    const gr = g.createRadialGradient(w / 2, w / 2, w * 0.16, w / 2, w / 2, w / 2);
    gr.addColorStop(0, 'rgba(220,235,255,.45)'); gr.addColorStop(0.4, 'rgba(220,235,255,.08)'); gr.addColorStop(1, 'rgba(220,235,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, w);
    g.fillStyle = '#f2ecdc'; g.beginPath(); g.arc(w / 2, w / 2, w * 0.16, 0, 6.283); g.fill();
    g.fillStyle = 'rgba(150,140,180,.28)';
    g.beginPath(); g.arc(w * 0.45, w * 0.46, w * 0.035, 0, 6.283); g.fill();
    g.beginPath(); g.arc(w * 0.56, w * 0.55, w * 0.022, 0, 6.283); g.fill();
    g.beginPath(); g.arc(w * 0.52, w * 0.42, w * 0.015, 0, 6.283); g.fill();
  }, [1, 1]);
  const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex, color: new THREE.Color(1.6, 1.6, 1.6), fog: false, depthWrite: false }));
  moon.scale.set(150, 150, 1); scene.add(moon);

  const stars = (() => {
    const n = 420, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, e = 0.06 + Math.pow(Math.random(), 0.7) * 1.4, r = 600;
      pos[i * 3] = Math.cos(a) * Math.cos(e) * r; pos[i * 3 + 1] = Math.sin(e) * r; pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r;
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const p = new THREE.Points(g, new THREE.PointsMaterial({ color: new THREE.Color(1.3, 1.25, 1.2), size: 2.0, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.85, depthWrite: false }));
    p.renderOrder = -9; scene.add(p); return p;
  })();

  const mountMat = basic({ color: atmo.mount, fog: false });
  const mountains = new THREE.Group();
  for (let i = 0; i < 54; i++) {
    const a = (i / 54) * Math.PI * 2 + hash(i) * 0.08, r = 430 + hash(i * 3) * 60;
    const h = 50 + hash(i * 7) * 140, rad = 45 + hash(i * 11) * 70;
    const m = mesh(new THREE.ConeGeometry(rad, h, 5), mountMat, Math.cos(a) * r, -70 + h / 2, Math.sin(a) * r);
    m.rotation.y = hash(i * 13) * 3; mountains.add(m);
  }
  scene.add(mountains);

  const seaMat = basic({ color: atmo.fog.clone() });
  const sea = mesh(new THREE.PlaneGeometry(2400, 2400), seaMat, 0, -16, 0);
  sea.rotation.x = -Math.PI / 2; scene.add(sea);

  // ---------- свет ----------
  const hemi = new THREE.HemisphereLight(C('#8f86c8'), C('#1a1428'), 1.15); scene.add(hemi);
  const moonLight = new THREE.DirectionalLight(C('#c8d6ff'), 1.1); scene.add(moonLight); scene.add(moonLight.target);
  const keyLight = new THREE.DirectionalLight(C('#ffe2c8'), 0.55); scene.add(keyLight); scene.add(keyLight.target);
  const fill = new THREE.PointLight(C('#ffd6a0'), 0.9, 10, 2); scene.add(fill);

  // ---------- тайлы пути ----------
  function fence(g, side, kind) {
    // ограда вдоль края: железная с пиками (кладбище) или деревянная жердь (ферма)
    if (kind === 'iron') {
      g.add(mesh(GEO.rail, M.iron, side * 1.7, 0.75, -TL / 2));
      g.add(mesh(GEO.rail, M.iron, side * 1.7, 0.2, -TL / 2));
      for (let z = -0.45; z > -TL; z -= 0.9) {
        g.add(mesh(GEO.railPost, M.iron, side * 1.7, 0.45, z));
        g.add(mesh(GEO.spike, M.iron, side * 1.7, 0.96, z));
      }
    } else {
      const r1 = mesh(GEO.unitBox, M.wood, side * 1.7, 0.7, -TL / 2); r1.scale.set(0.05, 0.08, TL); g.add(r1);
      const r2 = mesh(GEO.unitBox, M.wood, side * 1.7, 0.38, -TL / 2); r2.scale.set(0.05, 0.08, TL); g.add(r2);
      for (const z of [-1.5, -4.5, -7.5]) { const p = mesh(GEO.unitBox, M.wood, side * 1.7, 0.45, z); p.scale.set(0.09, 0.9, 0.09); g.add(p); }
    }
  }

  function buildTile(k) {
    const g = new THREE.Group();
    g.userData.flick = [];
    const li = locIdx(k * TL + 0.01), key = LOCS[li].key;
    g.add(mesh(GEO.slab, M.pathSide[li], 0, -0.31, -TL / 2));
    const top = mesh(GEO.pathTop, M.pathTop[li], 0, 0, -TL / 2); top.rotation.x = -Math.PI / 2; g.add(top);
    for (const s of [-1, 1]) g.add(mesh(GEO.edge, M.edge[li], s * 1.72, 0.02, -TL / 2));
    if ((key === 'city' || key === 'castle') && k % 2 === 0) g.add(mesh(key === 'castle' ? GEO.pier : GEO.pierRound, M.pathSide[li], 0, -23.6, -4.5));

    const flick = (s, base, ph, extra) => g.userData.flick.push(Object.assign({ s, base, ph }, extra || {}));
    if (key === 'castle') {
      if (k % 2 === 0) {
        g.add(mesh(GEO.arch, M.arch, 0, 0, -4.5));
        for (const s of [-1, 1]) {
          const f = mesh(GEO.flame, M.flame, s * 1.72, 2.55, -4.2); f.scale.set(1, 1.6, 1); g.add(f);
          const sp = glowSprite('#ffa54a', 1.3, 0.55); sp.position.copy(f.position); g.add(sp);
          flick(sp, 1.3, hash(k * 5 + s) * 9);
        }
      }
      if (k % 5 === 2) { const s = hash(k) < 0.5 ? -1 : 1; g.add(mesh(GEO.merlon, M.stoneLow, s * 1.98, 0.25, -6.5)); }
    } else if (key === 'city') {
      const s = k % 2 ? 1 : -1;
      g.add(mesh(GEO.post, M.post, s * 1.62, 1.7, -2));
      g.add(mesh(GEO.arm, M.post, s * 1.33, 3.4, -2));
      const head = mesh(GEO.head, M.lampHead, s * 1.08, 3.36, -2); g.add(head);
      const sp = glowSprite('#bfe6ff', 1.6, 0.5); sp.position.copy(head.position); g.add(sp);
      const pool = mesh(GEO.pool, M.cityPool, s * 0.85, 0.012, -2); pool.rotation.x = -Math.PI / 2; pool.scale.setScalar(1.4); g.add(pool);
      flick(sp, 1.6, hash(k) * 9, { broken: hash(k * 7) < 0.25, head, pool });
      for (const r of [-1, 1]) {
        g.add(mesh(GEO.rail, M.rail, r * 1.7, 0.9, -TL / 2));
        for (const z of [-1.5, -4.5, -7.5]) g.add(mesh(GEO.railPost, M.rail, r * 1.7, 0.45, z));
      }
    } else if (key === 'garden') {
      if (k % 3 === 0) {
        // высокая стрельчатая розовая арка: проходит над камерой и не рябит рядом с камнями
        const ROSE_H = 2.0;
        const rose = mesh(GEO.rose, M.hedge, 0, 0, -4.5); rose.scale.set(1, ROSE_H, 1); g.add(rose);
        for (let i = 0; i < 9; i++) {
          const a = Math.PI * (i + 0.5) / 9;
          const sp = glowSprite(i % 2 ? '#ffb3cf' : '#fff2f6', 0.45, 0.85);
          sp.position.set(Math.cos(a) * 1.8, Math.sin(a) * 1.8 * ROSE_H, -4.4); g.add(sp);
        }
      }
      const s = k % 2 ? 1 : -1;
      g.add(mesh(GEO.lanternPost, M.post, s * 1.62, 0.35, -2));
      const lh = mesh(GEO.lanternHead, M.lantern, s * 1.62, 0.74, -2); g.add(lh);
      const lsp = glowSprite('#ffd6a0', 1.0, 0.55); lsp.position.copy(lh.position); g.add(lsp);
      flick(lsp, 1.0, k * 1.7);
      for (const side of [-1, 1]) for (let i = 0; i < 2; i++) {
        const h = hash(k * 13 + side * 7 + i * 3), sc = 0.4 + h * 0.35;
        const b = mesh(GEO.bush, M.bush, side * (2.3 + h * 1.2), sc * 0.55, -1.5 - i * 4.5 - h * 2);
        b.scale.set(sc * 1.3, sc, sc * 1.2); b.rotation.y = h * 6; g.add(b);
      }
      for (let i = 0; i < 3; i++) {
        const h = hash(k * 41 + i);
        const sp = glowSprite('#d8ff8a', 0.32, 0.9);
        const base = new THREE.Vector3((h - 0.5) * 9, 0.4 + h * 1.8, -1 - hash(h * 7) * 7);
        sp.position.copy(base); g.add(sp);
        flick(sp, 0.32, h * 20, { fly: base });
      }
    } else if (key === 'cemetery') {
      // кладбище: кованая ограда, фонари с мятным огнём, ряды маленьких надгробий за оградой, стелющийся туман
      for (const s of [-1, 1]) fence(g, s, 'iron');
      const s = k % 2 ? 1 : -1;
      const p = mesh(GEO.unitBox, M.iron, s * 1.7, 0.75, -3); p.scale.set(0.08, 1.5, 0.08); g.add(p);
      const lh = mesh(GEO.lanternHead, M.ghostLantern, s * 1.7, 1.58, -3); lh.scale.set(1.3, 1.6, 1.3); g.add(lh);
      const lsp = glowSprite('#8affd8', 1.2, 0.5); lsp.position.copy(lh.position); g.add(lsp);
      flick(lsp, 1.2, k * 2.3);
      for (const side of [-1, 1]) for (let i = 0; i < 3; i++) {
        const h = hash(k * 19 + side * 5 + i);
        const t = mesh(GEO.tombSmall, M.smallStone, side * (2.4 + h * 2.2), 0, -1 - i * 3 - h);
        t.rotation.set(0, (h - 0.5) * 0.4, (h - 0.5) * 0.25); g.add(t);
      }
      for (let i = 0; i < 2; i++) {
        const h = hash(k * 23 + i);
        const mist = glowSprite('#9ab3c2', 3.5, 0.12); mist.position.set((h - 0.5) * 7, 0.35, -2 - h * 6); g.add(mist);
      }
    } else if (key === 'farm') {
      // ферма: деревянная ограда, тюки сена, пугало, фонарь-тыква на столбе
      for (const s of [-1, 1]) fence(g, s, 'wood');
      for (const side of [-1, 1]) if (hash(k * 7 + side) < 0.6) {
        const h = hash(k * 11 + side);
        const bale = mesh(GEO.hayBale, M.hay, side * (2.5 + h * 1.5), 0.45, -2 - h * 5); bale.rotation.z = Math.PI / 2; bale.rotation.y = h * 2; g.add(bale);
      }
      if (k % 4 === 1) {
        const s = hash(k) < 0.5 ? -1 : 1, x = s * 2.6;
        const pole = mesh(GEO.unitBox, M.wood, x, 1.1, -5); pole.scale.set(0.08, 2.2, 0.08); g.add(pole);
        const bar = mesh(GEO.unitBox, M.wood, x, 1.6, -5); bar.scale.set(1.3, 0.07, 0.07); g.add(bar);
        const body = mesh(GEO.unitBox, M.straw, x, 1.35, -5); body.scale.set(0.45, 0.6, 0.25); g.add(body);
        const head = mesh(GEO.lanternHead, M.hay, x, 1.9, -5); head.scale.setScalar(2.6); g.add(head);
        const hat = mesh(GEO.roofCone, M.barnRoof, x, 2.18, -5); hat.scale.set(0.3, 0.28, 0.3); g.add(hat);
      }
      const s = k % 2 ? 1 : -1;
      const lan = mesh(GEO.lanternHead, M.carve, s * 1.7, 1.0, -3); lan.scale.set(1.6, 1.3, 1.6); g.add(lan);
      const lsp = glowSprite('#ffa040', 1.1, 0.55); lsp.position.copy(lan.position); g.add(lsp);
      flick(lsp, 1.1, k * 1.3);
    } else if (key === 'subway') {
      // вагон метро: стенки с окнами, сиденья, поручни, светящиеся полосы на потолке; за окнами — тоннель с фонарями
      for (const s of [-1, 1]) {
        const low = mesh(GEO.unitBox, M.carPanel, s * 1.9, 0.5, -TL / 2); low.scale.set(0.08, 1.0, TL); g.add(low);
        const up = mesh(GEO.unitBox, M.carPanel, s * 1.9, 2.55, -TL / 2); up.scale.set(0.08, 0.9, TL); g.add(up);
        const gl = mesh(GEO.unitBox, M.glass, s * 1.9, 1.55, -TL / 2); gl.scale.set(0.02, 1.0, TL); g.add(gl);
        for (const z of [0, -2.25, -4.5, -6.75]) { const mu = mesh(GEO.unitBox, M.carDark, s * 1.88, 1.55, z); mu.scale.set(0.1, 1.04, 0.12); g.add(mu); }
        const seat = mesh(GEO.unitBox, M.seat, s * 1.72, 0.24, -TL / 2 - 0.3); seat.scale.set(0.3, 0.46, TL * 0.62); g.add(seat);
        const back = mesh(GEO.unitBox, M.seat, s * 1.84, 0.62, -TL / 2 - 0.3); back.scale.set(0.08, 0.5, TL * 0.62); g.add(back);
        // поручни и петли выше камеры, чтобы не мелькали перед глазами
        const rail = mesh(GEO.cyl, M.chrome, s * 1.05, 2.85, -TL / 2); rail.scale.set(0.025, TL, 0.025); rail.rotation.x = Math.PI / 2; g.add(rail);
        for (let z = -0.6; z > -TL; z -= 1.1) { const hd = mesh(GEO.handle, M.chrome, s * 1.05, 2.73, z); g.add(hd); }
        const pole = mesh(GEO.cyl, M.chrome, s * 1.64, 1.5, -1.3); pole.scale.set(0.03, 3, 0.03); g.add(pole);
        const tw = mesh(GEO.unitBox, M.tunnel, s * 3.4, 1.5, -TL / 2); tw.scale.set(0.2, 4, TL); g.add(tw);
        const tl = mesh(GEO.unitBox, M.tunnelLamp, s * 3.28, 1.7, -4.5); tl.scale.set(0.05, 0.12, 0.5); g.add(tl);
        const tsp = glowSprite('#ffd9a0', 1.2, 0.6); tsp.position.copy(tl.position); g.add(tsp);
      }
      const ceil = mesh(GEO.unitBox, M.ceiling, 0, 3.05, -TL / 2); ceil.scale.set(3.9, 0.1, TL); g.add(ceil);
      for (const s of [-1, 1]) { const ls = mesh(GEO.unitBox, M.lightStrip, s * 0.6, 2.99, -TL / 2); ls.scale.set(0.22, 0.03, TL * 0.94); g.add(ls); }
      if (k % 2 === 0) {
        // переход между вагонами: рамка с гармошкой, проём шире всех трёх полос
        for (const s of [-1, 1]) {
          const fr = mesh(GEO.unitBox, M.carDark, s * 1.75, 1.5, 0); fr.scale.set(0.35, 3, 0.4); g.add(fr);
          for (let i = 0; i < 4; i++) { const b = mesh(GEO.unitBox, M.bellows, s * 1.8, 1.5, 0.3 + i * 0.12); b.scale.set(0.3, 3, 0.05); g.add(b); }
        }
        const top = mesh(GEO.unitBox, M.carDark, 0, 2.92, 0); top.scale.set(3.9, 0.3, 0.4); g.add(top);
      }
    } else if (key === 'cave') {
      // пещера: каменные стены и свод не ниже 2,9 м, сталактиты, светящиеся кристаллы, редкие факелы
      for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
        const h = hash(k * 17 + s * 3 + i), sc = 1.3 + h * 0.5;
        // только поворот вокруг вертикали: иначе вытянутый камень может «лечь» на дорожку
        const r = mesh(GEO.rocks[i % 3], M.caveRock, s * (4.35 + h * 0.4), 0.6 + h * 1.6, -1.5 - i * 3);
        r.scale.set(sc, sc * 1.3, sc * 1.1); r.rotation.y = h * 5; g.add(r);
      }
      for (let i = 0; i < 3; i++) {
        const h = hash(k * 29 + i), sc = 1.5 + h * 0.6;
        const r = mesh(GEO.rocks[(i + 1) % 3], M.caveRock, (h - 0.5) * 3, 5.45 + h * 0.6, -1.5 - i * 3);
        r.scale.set(sc * 1.4, sc, sc * 1.2); r.rotation.y = h * 2; g.add(r);
      }
      for (let i = 0; i < 4; i++) {
        const h = hash(k * 37 + i), len = 0.4 + h * 0.4;
        const st = mesh(GEO.cone, M.caveRock, (h - 0.5) * 3.6, 3.75 - len / 2, -0.8 - i * 2.2 - h);
        st.scale.set(0.16, len, 0.16); st.rotation.x = Math.PI; g.add(st);
      }
      for (const s of [-1, 1]) if (hash(k * 5 + s) < 0.7) {
        const h = hash(k * 43 + s), z = -1 - h * 7, cm = h < 0.5 ? M.crystal : M.crystal2;
        for (let j = 0; j < 4; j++) {
          const cr = mesh(GEO.octa, cm, s * (2.05 + j * 0.12), 0.18 + j * 0.06, z + (j - 1.5) * 0.18);
          cr.scale.set(0.07, 0.24 + j * 0.05, 0.07); cr.rotation.z = s * (0.3 - j * 0.15); g.add(cr);
        }
        const sp = glowSprite(h < 0.5 ? '#b48aff' : '#6fe0ff', 1.4, 0.55); sp.position.set(s * 2.1, 0.35, z); g.add(sp);
        flick(sp, 1.4, h * 9);
      }
      if (k % 3 === 0) {
        const s = k % 2 ? 1 : -1;
        const f = mesh(GEO.flame, M.flame, s * 2.15, 1.9, -4.5); f.scale.set(1.3, 2, 1.3); g.add(f);
        const sp = glowSprite('#ffa54a', 1.8, 0.55); sp.position.copy(f.position); g.add(sp);
        flick(sp, 1.8, k * 1.1);
      }
    } else if (key === 'forest') {
      // лес: высокие деревья у самой дорожки, папоротники, лунные лучи и светлячки
      for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
        const h = hash(k * 13 + s * 5 + i);
        const x = s * (3.2 + h * 3), z = -1 - i * 3 - h, th = 6 + h * 5, tr = 0.9 + h * 0.6;
        const tk = mesh(GEO.cyl, M.trunk, x, 1.2, z); tk.scale.set(0.2, 2.4, 0.2); g.add(tk);
        for (let j = 0; j < 3; j++) {
          const c = mesh(GEO.tree, M.forestDark, x, 2.2 + j * th * 0.22 + th * 0.18, z); c.scale.set(tr * (1 - j * 0.25), th * 0.38, tr * (1 - j * 0.25)); g.add(c);
        }
      }
      for (const s of [-1, 1]) for (let i = 0; i < 2; i++) {
        const h = hash(k * 19 + s + i * 7);
        const f = mesh(GEO.bush, M.fern, s * (2.0 + h * 0.5), 0.15, -2 - i * 4 - h); f.scale.set(0.45, 0.2, 0.45); g.add(f);
      }
      if (hash(k * 3) < 0.5) {
        // лунный луч — сбоку от тропы, чтобы его не путали с препятствием
        const b = mesh(GEO.cone, M.moonbeam, (hash(k * 7) < 0.5 ? -1 : 1) * (3.2 + hash(k * 9) * 2), 3.5, -4); b.scale.set(1.2, 7, 1.2); g.add(b);
      }
      for (let i = 0; i < 2; i++) {
        const h = hash(k * 41 + i);
        const sp = glowSprite('#d8ff8a', 0.32, 0.9);
        const base = new THREE.Vector3((h - 0.5) * 7, 0.5 + h * 1.6, -1 - hash(h * 7) * 7);
        sp.position.copy(base); g.add(sp);
        flick(sp, 0.32, h * 20, { fly: base });
      }
    } else if (key === 'clouds') {
      // облака: дорожка-облако, по краям пушистые клубы чуть ниже уровня пути
      for (const s of [-1, 1]) for (let i = 0; i < 4; i++) {
        const h = hash(k * 23 + s * 3 + i), sc = 0.55 + h * 0.5;
        const p = mesh(GEO.cloudPuff, M.cloud, s * (2.3 + h * 0.8), -0.45 + h * 0.2, -1 - i * 2.3 - h);
        p.scale.set(sc * 1.4, sc * 0.7, sc); g.add(p);
      }
      for (let i = 0; i < 3; i++) {
        const h = hash(k * 31 + i), sc = 0.9 + h * 0.8;
        const p = mesh(GEO.cloudPuff, M.cloud, (h - 0.5) * 1.2, -0.85, -1.5 - i * 3);
        p.scale.set(2.2 + sc, 0.55, sc * 1.4); g.add(p);
      }
    } else if (key === 'beach') {
      // пляж: факелы тики вдоль дорожки и ракушки
      const s = k % 2 ? 1 : -1;
      const pole = mesh(GEO.unitBox, M.wood, s * 1.78, 0.7, -3); pole.scale.set(0.07, 1.4, 0.07); g.add(pole);
      const cup = mesh(GEO.cyl, M.straw, s * 1.78, 1.45, -3); cup.scale.set(0.09, 0.16, 0.09); g.add(cup);
      const f = mesh(GEO.flame, M.flame, s * 1.78, 1.62, -3); f.scale.set(1.4, 2.2, 1.4); g.add(f);
      const sp = glowSprite('#ffa54a', 1.6, 0.55); sp.position.copy(f.position); g.add(sp);
      flick(sp, 1.6, k * 1.9);
    }
    scene.add(g);
    return g;
  }

  function buildGate(s) {
    const li = s % LOCS.length;
    const g = new THREE.Group();
    for (const side of [-1, 1]) {
      g.add(mesh(GEO.pillar, M.gate, side * 2.25, 3.5, 0));
      g.add(mesh(GEO.gateEdge, M.gateEdge[li], side * 1.98, 3.2, 0.31));
    }
    g.add(mesh(GEO.lintel, M.gate, 0, 6.6, 0));
    g.add(mesh(GEO.sign, M.signs[li], 0, 5.95, 0.32));
    scene.add(g);
    return g;
  }

  // ---------- мир за дорожкой: крупные силуэты по чанкам ----------
  function buildChunk(c) {
    const g = new THREE.Group();
    g.userData.blink = []; g.userData.spin = [];
    const key = LOCS[locIdx(c * CL + CL / 2)].key;
    for (const side of [-1, 1]) {
      srand(c * 31 + (side > 0 ? 7 : 0) + 1);
      if (key === 'castle') {
        for (let i = 0; i < 2; i++) {
          const r = 5 + rr() * 8, h = 34 + rr() * 22, x = side * (15 + rr() * 34), z = -rr() * CL;
          const cliff = mesh(GEO.cone, M.silh, x, -34 + h / 2, z); cliff.scale.set(r, h, r); cliff.rotation.y = rr() * 3; g.add(cliff);
          if (rr() < 0.75) {
            const topY = -34 + h * 0.82, n = 2 + Math.floor(rr() * 3);
            const base = mesh(GEO.unitBox, M.silh, x, topY, z); base.scale.set(r * 0.7, 3, r * 0.7); g.add(base);
            for (let t = 0; t < n; t++) {
              const tr = 0.6 + rr() * 0.8, th = 4 + rr() * 7;
              const tx = x + (rr() - 0.5) * r * 0.8, tz = z + (rr() - 0.5) * r * 0.6;
              const tower = mesh(GEO.cyl, M.silh, tx, topY + th / 2, tz); tower.scale.set(tr, th, tr); g.add(tower);
              const roof = mesh(GEO.roofCone, M.roof, tx, topY + th + 1.3, tz); roof.scale.set(tr * 1.35, 2.8, tr * 1.35); g.add(roof);
              for (let wv = 0; wv < 3; wv++) if (rr() < 0.55) {
                const wy = topY + th * (0.35 + rr() * 0.5);
                const win = mesh(GEO.unitBox, M.windowLit, tx - side * tr * 0.98, wy, tz + (rr() - 0.5) * tr);
                win.scale.set(0.12, 0.42, 0.24); g.add(win);
              }
            }
          }
        }
      } else if (key === 'city') {
        for (let i = 0; i < 4; i++) {
          const w = 4 + rr() * 6, h = 18 + Math.pow(rr(), 1.4) * 60, d = 4 + rr() * 6;
          const x = side * (10 + rr() * 46 + w / 2), z = -rr() * CL;
          const b = mesh(GEO.unitBox, M.city[Math.floor(rr() * 3)], x, -26 + h / 2, z); b.scale.set(w, h, d); g.add(b);
          if (h > 50 && rr() < 0.6) {
            const sp = glowSprite('#ff4a4a', 2.4, 0.9); sp.position.set(x, -26 + h + 1, z); g.add(sp);
            g.userData.blink.push({ s: sp, ph: rr() * 6 });
          }
        }
      } else if (key === 'garden') {
        // холм всегда стоит так, чтобы его край был минимум в 8 м от дорожки
        const hrx = 14 + rr() * 16, hry = 5 + rr() * 6, hrz = 14 + rr() * 12;
        const hill = mesh(GEO.hill, M.hill, side * (HALF + 8 + hrx + rr() * 14), -3, -rr() * CL);
        hill.scale.set(hrx, hry, hrz); g.add(hill);
        for (let i = 0; i < 6; i++) {
          const x = side * (5 + rr() * 22), z = -rr() * CL, th = 3.5 + rr() * 4.5, tr = 0.9 + rr() * 0.9;
          const t = mesh(GEO.tree, M.tree, x, th / 2 + 0.6, z); t.scale.set(tr, th, tr); g.add(t);
          const tk = mesh(GEO.cyl, M.trunk, x, 0.35, z); tk.scale.set(0.12, 0.8, 0.12); g.add(tk);
        }
        for (let i = 0; i < 3; i++) {
          const sp = glowSprite('#d8ff8a', 0.5, 0.9);
          const base = new THREE.Vector3(side * (3 + rr() * 14), 0.6 + rr() * 2.5, -rr() * CL);
          sp.position.copy(base); g.add(sp);
          g.userData.blink.push({ s: sp, ph: rr() * 20, fly: base });
        }
      } else if (key === 'cemetery') {
        // голые деревья, склепы, часовня со шпилем и огоньком в окне
        for (let i = 0; i < 4; i++) {
          const x = side * (5 + rr() * 26), z = -rr() * CL, h = 4 + rr() * 4;
          const t = mesh(GEO.cyl, M.silhGrey, x, h / 2, z); t.scale.set(0.18, h, 0.18); g.add(t);
          for (let b = 0; b < 4; b++) {
            const bl = 1 + rr() * 1.8, by = h * (0.45 + rr() * 0.5);
            const br = mesh(GEO.cyl, M.silhGrey, x, by, z); br.scale.set(0.06, bl, 0.06);
            br.rotation.set((rr() - 0.5) * 1.2, rr() * 3, (rr() < 0.5 ? -1 : 1) * (0.6 + rr() * 0.6));
            br.position.y += bl * 0.3; g.add(br);
          }
        }
        for (let i = 0; i < 2; i++) {
          const x = side * (7 + rr() * 18), z = -rr() * CL, w = 2 + rr() * 1.5;
          const crypt = mesh(GEO.unitBox, M.silhGrey, x, 1.2, z); crypt.scale.set(w, 2.4, w * 1.2); g.add(crypt);
          const roof = mesh(GEO.pyramid, M.silhGrey, x, 3.0, z); roof.scale.set(w * 0.85, 1.4, w); roof.rotation.y = Math.PI / 4; g.add(roof);
        }
        if (rr() < 0.4) {
          const x = side * (30 + rr() * 20), z = -rr() * CL;
          const ch = mesh(GEO.unitBox, M.silhGrey, x, 3, z); ch.scale.set(6, 6, 9); g.add(ch);
          const tw = mesh(GEO.unitBox, M.silhGrey, x, 6, z + 3); tw.scale.set(2.4, 12, 2.4); g.add(tw);
          const sp = mesh(GEO.pyramid, M.silhGrey, x, 14.5, z + 3); sp.scale.set(1.9, 5, 1.9); sp.rotation.y = Math.PI / 4; g.add(sp);
          const win = mesh(GEO.unitBox, M.ghostLantern, x - side * 1.22, 8, z + 3); win.scale.set(0.1, 0.9, 0.5); g.add(win);
        }
        const gr = mesh(GEO.groundStrip, M.graveGround, side * 352, -0.06, -CL / 2); gr.rotation.x = -Math.PI / 2; g.add(gr);
      } else if (key === 'farm') {
        // амбары, силос, мельница — её крылья крутит ветер
        for (let i = 0; i < 2; i++) {
          const x = side * (8 + rr() * 26), z = -rr() * CL, w = 4 + rr() * 3, d = 6 + rr() * 4, h = 3 + rr() * 2;
          const barn = mesh(GEO.unitBox, M.barn, x, h / 2, z); barn.scale.set(w, h, d); g.add(barn);
          const roof = mesh(GEO.pyramid, M.barnRoof, x, h + 1.2, z); roof.scale.set(w * 0.75, 2.4, d * 0.75); roof.rotation.y = Math.PI / 4; g.add(roof);
          if (rr() < 0.7) { const win = mesh(GEO.unitBox, M.windowLit, x - side * w / 2 - 0.02, h * 0.55, z); win.scale.set(0.05, 0.7, 0.9); g.add(win); }
        }
        if (rr() < 0.5) {
          const x = side * (12 + rr() * 20), z = -rr() * CL;
          const silo = mesh(GEO.cyl, M.silhGrey, x, 4, z); silo.scale.set(1.4, 8, 1.4); g.add(silo);
          const dome = mesh(GEO.hill, M.silhGrey, x, 8, z); dome.scale.set(1.4, 1, 1.4); g.add(dome);
        }
        if (rr() < 0.55) {
          const x = side * (14 + rr() * 24), z = -rr() * CL;
          const tower = mesh(GEO.cone, M.barn, x, 4.5, z); tower.scale.set(2, 9, 2); g.add(tower);
          const hub = new THREE.Group(); hub.position.set(x, 8.6, z + 1.6);
          for (let b = 0; b < 4; b++) { const bl = mesh(GEO.blade, M.wood, 0, 2.5, 0); const arm = new THREE.Group(); arm.rotation.z = b * Math.PI / 2; arm.add(bl); hub.add(arm); }
          g.add(hub); g.userData.spin.push(hub);
        }
        const gr = mesh(GEO.groundStrip, M.field, side * 352, -0.06, -CL / 2); gr.rotation.x = -Math.PI / 2; g.add(gr);
      } else if (key === 'forest') {
        // густой лес: ряды тёмных елей уходят в туман
        for (let i = 0; i < 14; i++) {
          const x = side * (7 + rr() * 40), z = -rr() * CL, th = 7 + rr() * 9, tr = 1.3 + rr() * 1.4;
          const t = mesh(GEO.tree, M.forestDark, x, th / 2 + 1, z); t.scale.set(tr, th, tr); g.add(t);
        }
        for (let i = 0; i < 3; i++) {
          const sp = glowSprite('#d8ff8a', 0.5, 0.9);
          const base = new THREE.Vector3(side * (4 + rr() * 12), 0.6 + rr() * 2.5, -rr() * CL);
          sp.position.copy(base); g.add(sp);
          g.userData.blink.push({ s: sp, ph: rr() * 20, fly: base });
        }
        const gr = mesh(GEO.groundStrip, M.ground, side * 352, -0.06, -CL / 2); gr.rotation.x = -Math.PI / 2; g.add(gr);
      } else if (key === 'clouds') {
        // море облаков ниже дорожки и снежные вершины, пробивающие облака вдали
        for (let i = 0; i < 7; i++) {
          // край клуба всегда в стороне от дорожки, верх — ниже её уровня
          const sc = 3 + rr() * 6, x = side * (4 + sc * 1.6 * 1.15 + rr() * 40), z = -rr() * CL;
          const p = mesh(GEO.cloudPuff, rr() < 0.5 ? M.cloud : M.cloudFar, x, -1.2 - sc * 0.55, z); p.scale.set(sc * 1.6, sc * 0.45, sc); g.add(p);
        }
        if (rr() < 0.7) {
          const x = side * (16 + rr() * 50), z = -rr() * CL, h = 10 + rr() * 22, r = 4 + rr() * 6;
          const m = mesh(GEO.cone, M.peakFar, x, -6 + h / 2, z); m.scale.set(r, h, r); m.rotation.y = rr() * 3; g.add(m);
          const cap = mesh(GEO.cone, M.snow, x, -6 + h - h * 0.12, z); cap.scale.set(r * 0.32, h * 0.25, r * 0.32); cap.rotation.y = m.rotation.y; g.add(cap);
        }
      } else if (key === 'beach') {
        // справа море с лунной дорожкой и прибоем, слева дюны и пальмы
        if (side > 0) {
          const sandR = mesh(GEO.unitBox, M.sand, 3.2, -0.1, -CL / 2); sandR.scale.set(2.9, 0.2, CL); g.add(sandR);
          const water = mesh(GEO.groundStrip, M.water, 4.6 + 350, -0.18, -CL / 2); water.rotation.x = -Math.PI / 2; g.add(water);
          const foam = mesh(GEO.unitBox, M.foam, 4.7, -0.14, -CL / 2); foam.scale.set(0.25, 0.02, CL); g.add(foam);
          g.userData.foam = foam;
          for (let i = 0; i < 10; i++) {
            const sp = glowSprite('#dfe9ff', 0.6 + rr() * 0.8, 0.6);
            sp.position.set(12 + rr() * 90, -0.1, -rr() * CL); g.add(sp);
            g.userData.blink.push({ s: sp, ph: rr() * 20, glint: true });
          }
          if (rr() < 0.4) { const isl = mesh(GEO.hill, M.palmDark, 60 + rr() * 60, -2, -rr() * CL); isl.scale.set(10 + rr() * 10, 4 + rr() * 3, 8); g.add(isl); }
        } else {
          const sandL = mesh(GEO.groundStrip, M.sand, -352, -0.06, -CL / 2); sandL.rotation.x = -Math.PI / 2; g.add(sandL);
          for (let i = 0; i < 3; i++) {
            const sx = 8 + rr() * 8, sy = 2.5 + rr() * 2;
            const d = mesh(GEO.hill, M.sand, -(HALF + 6 + sx * 1.1 + rr() * 25), -1.2, -rr() * CL); d.scale.set(sx, sy, 6 + rr() * 6); g.add(d);
          }
          // пальмы наклонены от дорожки и стоят так, чтобы листья не нависали над ней
          for (let i = 0; i < 6; i++) { const p = makePalm(M.palmTrunk, M.palmDark, 0.8 + rr() * 0.7, rr() * 0.5); p.position.set(-(4.8 + rr() * 22), 0, -rr() * CL); g.add(p); }
        }
      }
    }
    if (key === 'garden') { const gr = mesh(GEO.groundStrip, M.ground, 0, -0.05, -CL / 2); gr.rotation.x = -Math.PI / 2; g.add(gr); }
    scene.add(g);
    return g;
  }

  const tiles = new Map(), gates = new Map(), chunks = new Map();
  function syncMap(map, k0, k1, build, place) {
    for (const [k, g] of map) if (k < k0 || k > k1) { scene.remove(g); map.delete(k); }
    for (let k = k0; k <= k1; k++) {
      let g = map.get(k);
      if (!g) { g = build(k); map.set(k, g); }
      place(g, k);
    }
  }
  function updateWorld(dt) {
    syncMap(tiles, Math.floor((G.dist - 8) / TL), Math.floor((G.dist + TILES_AHEAD) / TL), buildTile, (g, k) => {
      g.position.z = zOf(k * TL);
      for (const f of g.userData.flick) {
        if (f.fly) {
          f.s.position.set(f.fly.x + Math.sin(T * 0.9 + f.ph) * 0.4 - G.wind * 0.6, f.fly.y + Math.sin(T * 1.7 + f.ph * 2) * 0.25, f.fly.z + Math.cos(T * 0.7 + f.ph) * 0.4);
          f.s.material.opacity = 0.35 + 0.6 * Math.max(0, Math.sin(T * 3 + f.ph));
          continue;
        }
        if (f.broken) {
          const on = Math.sin(T * 17 + f.ph) > 0.2 && Math.sin(T * 3.1 + f.ph) > -0.6;
          f.s.visible = on; f.head.visible = on; f.pool.visible = on;
        }
        const s = f.base * (0.88 + 0.12 * Math.sin(T * 13 + f.ph));
        f.s.scale.set(s, s, 1);
      }
    });
    syncMap(gates, Math.max(1, segOf(G.dist - 8)), segOf(G.dist + TILES_AHEAD) + 1, buildGate, (g, s) => { g.position.z = zOf(s * LOC_LEN); });
    syncMap(chunks, Math.floor((G.dist - 60) / CL), Math.floor((G.dist + WORLD_AHEAD) / CL), buildChunk, (g, c) => {
      g.position.z = zOf(c * CL);
      for (const h of g.userData.spin) h.rotation.z -= dt * (0.3 + G.wind * 3.2);
      if (g.userData.foam) g.userData.foam.position.x = 4.7 + Math.sin(T * 0.9) * 0.25;
      for (const b of g.userData.blink) {
        if (b.glint) { b.s.material.opacity = Math.max(0, Math.sin(T * 4 + b.ph)) * 0.7; continue; }
        if (b.fly) {
          b.s.position.set(b.fly.x + Math.sin(T * 0.6 + b.ph) * 0.8, b.fly.y + Math.sin(T * 1.1 + b.ph) * 0.4, b.fly.z);
          b.s.material.opacity = 0.3 + 0.6 * Math.max(0, Math.sin(T * 2.4 + b.ph));
        } else b.s.material.opacity = Math.sin(T * 2.2 + b.ph) > 0.3 ? 0.95 : 0.08;
      }
    });

    // атмосфера плавно перетекает к палитре уровня впереди
    const L = LOCS[locIdx(G.dist + 30)];
    const k = Math.min(1, dt * 1.2);
    atmo.top.lerp(L.cTop, k); atmo.fog.lerp(L.cFog, k); atmo.low.lerp(L.cLow, k); atmo.mount.lerp(L.cMount, k);
    scene.fog.color.copy(atmo.fog);
    seaMat.color.copy(atmo.fog).multiplyScalar(0.8);
  }

  // ---------- модели ----------
  function makeKnight() {
    const g = new THREE.Group();
    const legs = [], arms = [];
    for (const s of [-1, 1]) {
      const p = new THREE.Group(); p.position.set(s * 0.12, 0.56, 0);
      p.add(mesh(new THREE.BoxGeometry(0.15, 0.56, 0.17), M.steel, 0, -0.28, 0));
      p.add(mesh(new THREE.BoxGeometry(0.17, 0.08, 0.24), M.steelDark, 0, -0.52, 0.03));
      g.add(p); legs.push(p);
      const a = new THREE.Group(); a.position.set(s * 0.35, 0.98, 0);
      a.add(mesh(new THREE.BoxGeometry(0.1, 0.42, 0.12), M.steel, 0, -0.21, 0));
      a.add(mesh(new THREE.SphereGeometry(0.065, 10, 8), M.steelDark, 0, -0.44, 0));
      g.add(a); arms.push(a);
      g.add(mesh(new THREE.SphereGeometry(0.12, 14, 10), M.steel, s * 0.3, 1.0, 0));
    }
    const torso = mesh(new THREE.CylinderGeometry(0.28, 0.2, 0.54, 10), M.steel, 0, 0.8, 0);
    torso.scale.z = 0.72; g.add(torso);
    const belt = mesh(new THREE.CylinderGeometry(0.215, 0.215, 0.06, 10), M.leather, 0, 0.58, 0);
    belt.scale.z = 0.75; g.add(belt);
    g.add(mesh(new THREE.BoxGeometry(0.02, 0.4, 0.02), M.steelDark, 0, 0.84, 0.205));
    const headG = new THREE.Group(); headG.position.y = 1.27; g.add(headG);
    headG.add(mesh(new THREE.SphereGeometry(0.19, 18, 14), M.steel, 0, 0, 0));
    headG.add(mesh(new THREE.BoxGeometry(0.27, 0.05, 0.04), M.steelDark, 0, 0.02, 0.17));
    headG.add(mesh(new THREE.BoxGeometry(0.02, 0.28, 0.02), M.steelDark, 0, 0.03, -0.185));
    const plume = mesh(new THREE.SphereGeometry(0.07, 10, 8), M.plume, 0, 0.23, -0.04);
    plume.scale.set(0.85, 1.6, 1.4); headG.add(plume);
    return { g, legs, arms, head: headG };
  }

  const ghostProfile = [];

  // контур призрака: плоская светящаяся линия по силуэту, всегда повёрнута к камере
  function outlinePoints(t) {
    const pts = [[-0.4, 0], [-0.385, 0.1], [-0.37, 0.22]];
    for (let i = 0; i <= 18; i++) { const a = Math.PI - (i / 18) * Math.PI; pts.push([0.36 * Math.cos(a), 0.36 + 0.36 * Math.sin(a)]); }
    pts.push([0.37, 0.22], [0.385, 0.1], [0.4, 0]);
    const n = 4, w = 0.8 / n, sp = 8 + WIND * 6;
    for (let s = 0; s < n; s++) {
      const x0 = 0.4 - s * w, depth = 0.11 + Math.sin(t * sp + s * 1.7) * 0.035 * (1 + WIND);
      for (let j = 1; j <= 6; j++) {
        if (s === n - 1 && j === 6) break;
        const u = j / 6; pts.push([x0 - u * w, -Math.sin(u * Math.PI) * depth]);
      }
    }
    return pts;
  }
  const OUT_N = outlinePoints(0).length, OUT_W = 0.026;
  const outlineGeo = new THREE.BufferGeometry();
  outlineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(OUT_N * 2 * 3), 3));
  {
    const idx = [];
    for (let i = 0; i < OUT_N; i++) { const j = (i + 1) % OUT_N; idx.push(i * 2, i * 2 + 1, j * 2, j * 2, i * 2 + 1, j * 2 + 1); }
    outlineGeo.setIndex(idx);
  }
  function updateOutline() {

    for (let i = 0; i < OUT_N; i++) {
      const p = pts[i], pa = pts[(i - 1 + OUT_N) % OUT_N], pb = pts[(i + 1) % OUT_N];
      let tx = pb[0] - pa[0], ty = pb[1] - pa[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
      const nx = -ty * OUT_W, ny = tx * OUT_W;
      a[i * 6] = p[0] + nx; a[i * 6 + 1] = p[1] + ny; a[i * 6 + 2] = 0;
      a[i * 6 + 3] = p[0] - nx; a[i * 6 + 4] = p[1] - ny; a[i * 6 + 5] = 0;
    }

    outlineGeo.computeBoundingSphere();
  }
  const outlineMat = basic({ color: HDR('#79f2cf', 2.6), transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });

  const MINT = C('#79f2cf'), BONE = C('#f6f1e6'), INK = C('#1a1428');

  // ---------- частицы ----------
  function makeParts(max, additive, size, map) {
    const pos = new Float32Array(max * 3).fill(-999), col = new Float32Array(max * 3);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({ size, vertexColors: true, map: map || T_glow, transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, sizeAttenuation: true });
    const pts = new THREE.Points(g, mat); pts.frustumCulled = false; scene.add(pts);
    const list = [];
    let cursor = 0;
    const tmp = new THREE.Color();
    return {
      emit(x, y, z, n, colors, spd, grav = 4, life = 1, boost = 1, vel) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2, e = Math.random() * Math.PI - Math.PI / 2, v = spd * (0.3 + Math.random());
          const idx = cursor; cursor = (cursor + 1) % max;
          list[idx] = vel ? { x, y, z, vx: vel[0], vy: vel[1], vz: vel[2], life, grav, wob: Math.random() * 6 }
            : { x, y, z, vx: Math.cos(a) * Math.cos(e) * v, vy: Math.abs(Math.sin(e)) * v + spd * 0.3, vz: Math.sin(a) * Math.cos(e) * v, life: life * (0.6 + Math.random() * 0.6), grav };
          tmp.set(colors[(Math.random() * colors.length) | 0]).convertSRGBToLinear().multiplyScalar(boost);
          col[idx * 3] = tmp.r; col[idx * 3 + 1] = tmp.g; col[idx * 3 + 2] = tmp.b;

      },
      update(dt, scroll) {

          const p = list[i];

  // стилизованный пассажир метро: аккуратный силуэт без лица, пастельная куртка, лёгкое покачивание

  // пальма: изогнутый ствол из сегментов, поникшие листья, кокосы
  function makePalm(trunkMat, leafMat, sc, h) {
    const g = new THREE.Group();

  const G = { state: 'menu', t: 0, dist: 0, speed: 7, coins: 0, bonus: 0, energy: 1, objs: [], spawnAt: 0, wallRun: 0, shake: 0, deathT: 0, cause: '', armorT: 0, grace: 0, lastArmor: 0, seg: 0, knock: 0, knockTo: 0, dt: 0.016, wind: 0.2, windTarget: 0.2, windNext: 6, gustT: 0 };
  const pl = { lane: 0, x: 0, vx: 0, ghost: false, phase: 0, face: 1, lean: 0, leanV: 0, squash: 0, camX: 0 };
  let T = 0;

  function reset(startLevel = 0) {
    for (const o of G.objs) removeObj(o);
    G.t = 0; G.dist = startLevel * LOC_LEN; G.startDist = G.dist; G.coins = 0; G.bonus = 0; G.energy = 1;
    G.objs = []; G.spawnAt = G.dist + 24; G.wallRun = 0; G.shake = 0;
    G.armorT = 0; G.grace = 0; G.lastArmor = 0; G.seg = startLevel; G.knock = 0; G.knockTo = 0; G.newUnlocks = [];
    G.wind = 0.15; G.windTarget = 0.15; G.windNext = 7; G.gustT = 0;
    G.speed = speedFor(G.wind, 0);
    pl.lane = 0; pl.x = 0; pl.vx = 0; pl.ghost = false; pl.phase = 0; pl.lean = 0; pl.leanV = 0;
    sparks.clear(); debris.clear(); leaves.clear();
  }

  // ---------- ветер: от него зависит скорость ----------
  // база ветра медленно растёт со временем, поверх неё — случайные смены и короткие порывы
  function speedFor(wind, t) { return 10 + wind * 13 + Math.min(4, t * 0.015); }
  function updateWind(dt) {
    if (G.state === 'play') {
      G.windNext -= dt;
      const base = Math.min(0.65, 0.15 + G.t * 0.0035);
      if (G.gustT > 0) { G.gustT -= dt; if (G.gustT <= 0) G.windTarget = Math.max(0, Math.min(1, base + (Math.random() - 0.5) * 0.3)); }
      if (G.windNext <= 0) {
        if (Math.random() < 0.3) { G.windTarget = Math.min(1, base + 0.3 + Math.random() * 0.2); G.gustT = 2.5 + Math.random() * 2; }
        else G.windTarget = Math.max(0, Math.min(1, base + (Math.random() - 0.45) * 0.35));
        G.windNext = 5 + Math.random() * 5;
      }
    } else if (G.state === 'menu') {
      G.windTarget = 0.25 + 0.15 * Math.sin(T * 0.3);
    }
    const rate = G.windTarget > G.wind ? 0.35 : 0.2;
    G.wind += Math.sign(G.windTarget - G.wind) * Math.min(Math.abs(G.windTarget - G.wind), rate * dt);
    WIND = G.wind;
  }

  // ---------- генерация рядов: 5 ступеней сложности внутри каждого уровня ----------
  const STAGES = [
    { pool: ['w1', 'w1', 'w2'], gap: 1.45 },
    { pool: ['w1', 'w2', 'w2'], gap: 1.3 },
    { pool: ['w1', 'w2', 'w3'], gap: 1.15 },
    { pool: ['w2', 'w3', 'w2', 'w3'], gap: 1.05 },
    { pool: ['w2', 'w3', 'w3'], gap: 0.95 }
  ];
  const SPEC = { w1: ['wall', null, null], w2: ['wall', 'wall', null], w3: ['wall', 'wall', 'wall'] };
  const rnd = n => Math.floor(Math.random() * n);
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function addObj(o) { o.mesh = makeObjMesh(o); G.objs.push(o); }

  function rowGap(w) {
    const st = STAGES[G.state === 'play' ? stageOf(w) : 1];
    const cycle = Math.floor(segOf(w) / LOCS.length);
    const t = Math.max(0.72, st.gap - cycle * 0.07);
    // расстояние между рядами растёт с ветром лишь частично — в порыв ряды приходят чаще
    return Math.max(6, t * (10 + G.wind * 6));
  }
  function makeRow(w, gap) {
    const st = STAGES[G.state === 'play' ? stageOf(w) : 1];
    let pick = st.pool[rnd(st.pool.length)];
    if (pick === 'w3' && G.wallRun >= 1) pick = 'w2';
    G.wallRun = pick === 'w3' ? G.wallRun + 1 : 0;

    const lanes = shuffle(SPEC[pick].slice());
    lanes.forEach((t, i) => { if (t === 'wall') addObj({ type: 'wall', lane: i - 1, w }); });

    const free = lanes.map((t, i) => (t ? null : i - 1)).filter(v => v !== null);
    if (G.state === 'play' && G.t > 10 && G.t - G.lastArmor > 20 && free.length && Math.random() < 0.35) {
      addObj({ type: 'armor', lane: free[rnd(free.length)], w: w - gap * 0.5, taken: false });
      G.lastArmor = G.t;
    }

    if (Math.random() < 0.8) {
      const lane = rnd(3) - 1;
      const n = 3 + rnd(3);
      for (let i = 0; i < n; i++) {
        const cw = w + 2.2 + i * 1.4;
        if (cw > w + gap - 1.2) break;
        addObj({ type: 'coin', lane, w: cw, taken: false });
      }
    }
  }

  function spawn() {
    while (G.spawnAt < G.dist + FAR) {
      // в начале каждого уровня — передышка перед воротами
      const inLoc = G.spawnAt % LOC_LEN;
      if (G.state === 'play' && G.spawnAt > LOC_LEN && inLoc < 14) { G.spawnAt += 14 - inLoc; continue; }
      const gap = rowGap(G.spawnAt);
      makeRow(G.spawnAt, gap);
      G.spawnAt += gap;
    }
  }

  // ---------- звук ----------
  let ac = null, muted = false, windNode = null, windGain = null, windFilter = null;
  try { muted = localStorage.getItem('casper-run-muted') === '1'; } catch (e) {}
  ui.mute.classList.toggle('muted', muted);
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
    // шум ветра: отфильтрованный белый шум, громкость и тембр следуют силе ветра
    try {
      const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      windNode = ac.createBufferSource(); windNode.buffer = buf; windNode.loop = true;
      windFilter = ac.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.Q.value = 0.8; windFilter.frequency.value = 400;
      windGain = ac.createGain(); windGain.gain.value = 0;
      windNode.connect(windFilter).connect(windGain).connect(ac.destination);
      windNode.start();
    } catch (e) { windNode = null; }
  }
  function sfx(f1, f2, dur, type = 'sine', vol = 0.07, delay = 0) {
    if (muted || !ac) return;
    const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  function toast(sub, name) {
    ui.toastSub.textContent = sub;
    ui.toastName.textContent = name;
    ui.toast.hidden = true; void ui.toast.offsetWidth; ui.toast.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { ui.toast.hidden = true; }, 2600);
  }
  const levelLabel = seg => `Level ${(seg % LOCS.length) + 1}${seg >= LOCS.length ? ' · lap ' + (Math.floor(seg / LOCS.length) + 1) : ''}`;

  // ---------- управление ----------
  function move(d) {
    if (G.state !== 'play') return;
    const nl = Math.max(-1, Math.min(1, pl.lane + d));
    if (nl !== pl.lane) { pl.lane = nl; pl.squash = 1; sfx(220, 300, 0.06, 'triangle', 0.04); }
  }
  function toggle() {
    if (G.state !== 'play' || G.armorT > 0) return;
    if (!pl.ghost) {
      if (G.energy < 0.12) {
        ui.ring.classList.remove('nope'); void ui.ring.offsetWidth; ui.ring.classList.add('nope');
        sfx(160, 120, 0.12, 'square', 0.04);
        return;
      }
      pl.ghost = true; sfx(320, 960, 0.18);
    } else {
      pl.ghost = false; sfx(760, 260, 0.15);
    }
  }

  // каждый палец отслеживается отдельно: один может свайпать, другой — тапать
  const ptrs = new Map();
  root.addEventListener('pointerdown', e => {
    if (G.state !== 'play' || e.target.closest('button')) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, moved: false, dir: 0, ext: e.clientX });
  });
  // один свайп = одна полоса. Повторный сдвиг в ту же сторону — только после длинного дотягивания,
  // разворот пальца в обратную сторону срабатывает сразу от крайней точки.
  const SWIPE = 24, SWIPE_AGAIN = 120;
  root.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const x = e.clientX, dx = x - p.x, dy = e.clientY - p.y;
    if (p.dir) {
      if ((x - p.ext) * p.dir > 0) p.ext = x;
      if ((p.ext - x) * p.dir > SWIPE) {
        move(-p.dir); p.dir = -p.dir; p.x = x; p.ext = x; return;
      }
      if (dx * p.dir > SWIPE_AGAIN) { move(p.dir); p.x = x; p.ext = x; }
      return;
    }
    if (Math.abs(dx) > SWIPE && Math.abs(dx) > Math.abs(dy) * 0.8) {
      p.dir = dx > 0 ? 1 : -1;
      move(p.dir); p.x = x; p.ext = x; p.moved = true;
    } else if (dy < -40 && Math.abs(dy) > Math.abs(dx) && !p.moved) {
      toggle(); p.moved = true; p.y = e.clientY;
    }
  });
  const endPtr = (e, cancelled) => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    ptrs.delete(e.pointerId);
    if (!cancelled && !p.moved) toggle();
  };
  root.addEventListener('pointerup', e => endPtr(e, false));
  root.addEventListener('pointercancel', e => endPtr(e, true));
  root.addEventListener('lostpointercapture', e => endPtr(e, true));

  window.addEventListener('keydown', e => {
    const k = e.key;
    if (G.state === 'play') {
      if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'ф' || k === 'Ф') { move(-1); e.preventDefault(); }
      else if (k === 'ArrowRight' || k === 'd' || k === 'D' || k === 'в' || k === 'В') { move(1); e.preventDefault(); }
      else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'ц' || k === 'Ц') { if (!e.repeat) toggle(); e.preventDefault(); }
      else if (k === 'Escape' || k === 'p' || k === 'P') pauseGame();
    } else if ((G.state === 'menu' || G.state === 'over') && k === 'Enter') {

    } else if (G.state === 'paused' && (k === 'Enter' || k === 'Escape')) {

    }
  });
